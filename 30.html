<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>jaguarluna</title>

<style>
body{
  margin:0;
  background:transparent;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  overflow:hidden;
}

/* ===== PARTICELLE RGB ===== */
#rgbParticles{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  z-index:-1;
  pointer-events:none;
}

.container{
  position:relative;
  width:1308px;
  height:484px;
}

/* ===== CONTENITORE VIDEO ===== */
.video-wrapper{
  position:absolute;
  width:270px;
  height:484px;
  overflow:hidden;
  z-index:1;
  background:transparent;
  border-radius:20px;
}

.left{left:0}
.right{right:0}

/* ===== BORDI ===== */
.video-wrapper::before{
  content:"";
  position:absolute;
  inset:0;
  padding:4px;
  border-radius:20px;
  background:conic-gradient(
    red,orange,yellow,lime,cyan,blue,violet,red
  );
  -webkit-mask:
    linear-gradient(#fff 0 0) content-box,
    linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  filter:drop-shadow(0 0 10px rgba(255,0,255,.7));
  pointer-events:none;
}

/* ===== VIDEO ===== */
.side-video{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:16px;
}

/* ===== TESTO ARCOBALENO VIDEO ===== */
.video-text{
  position:absolute;
  bottom:8px;
  left:50%;
  transform:translateX(-50%);
  font-size:25px;
  font-family:Trebuchet MS;
  font-weight:bold;
  z-index:2;
  background:linear-gradient(90deg,red,orange,yellow,lime,cyan,blue,violet,red);
  background-size:400% 100%;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:rainbowText 3s linear infinite;
}

@keyframes rainbowText{
  0%{background-position:0%}
  100%{background-position:100%}
}

/* ===== AREA CENTRALE ===== */
.center-area{
  position:absolute;
  left:280px;
  right:280px;
  top:0;
  bottom:0;
  display:flex;
  justify-content:center;
  align-items:center;
  pointer-events:none;
  z-index:0;
}

/* ===== CONTENITORE ===== */
.center-box{
  position:relative;
  width:420px;
  height:420px;
  max-width:90%;
  animation:fadeLoop 6s ease-in-out infinite;
  filter:drop-shadow(0 0 25px rgba(255,0,0,.4));
}

/* ===== IFRAME ===== */
.center-box iframe{
  width:100%;
  height:100%;
  border:none;
  display:block;
  border-radius:12px;
  background:transparent;
}

/* ===== TESTO ===== */
.center-title{
  position:absolute;
  bottom:12px;
  left:50%;
  transform:translateX(-50%);
  font-size:38px;
  font-family:Trebuchet MS;
  font-weight:900;
  letter-spacing:3px;
  color:#d8d8d8;

  text-shadow:
    0 1px 0 #fff,
    0 2px 0 #cfcfcf,
    0 3px 0 #b5b5b5,
    0 4px 0 #9b9b9b,
    0 6px 10px rgba(0,0,0,.8);

  pointer-events:none;
  z-index:3;
}

/* ===== FADE ===== */
@keyframes fadeLoop{
  0%{opacity:0}
  20%{opacity:0}
  50%{opacity:1}
  80%{opacity:0}
  100%{opacity:0}
}
</style>
</head>

<body>

<!-- SFONDO PARTICELLE RGB -->
<canvas id="rgbParticles"></canvas>

<div class="container">

  <!-- VIDEO SINISTRO -->
  <div class="video-wrapper left">
    <video class="side-video" autoplay loop muted playsinline>
      <source src="https://jaguaronero.github.io/hearts/30.mp4">
    </video>
    <div class="video-text">GO_TO_MUSIC</div>
  </div>

  <!-- VIDEO DESTRO -->
  <div class="video-wrapper right">
    <video class="side-video" autoplay loop muted playsinline>
      <source src="https://jaguaronero.github.io/hearts/30.mp4">
    </video>
    <div class="video-text">GO_TO_MUSIC</div>
  </div>

  <!-- CENTRO -->
  <div class="center-area">
    <div class="center-box">
      <iframe src="https://jaguaronero.github.io/hearts/name.html" scrolling="no"></iframe>
      <div class="center-title"></div>
    </div>
  </div>

</div>

<script>
const canvas = document.getElementById("rgbParticles");
const ctx = canvas.getContext("2d");

function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

const particles = [];
const particleCount = 120;

for(let i=0;i<particleCount;i++){
  particles.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    radius:2+Math.random()*5,
    speedX:(Math.random()-0.5)*1.5,
    speedY:(Math.random()-0.5)*1.5,
    hue:Math.random()*360
  });
}

function drawParticles(){

  ctx.clearRect(0,0,canvas.width,canvas.height);

  particles.forEach((p)=>{

    p.x += p.speedX;
    p.y += p.speedY;
    p.hue += 1;

    if(p.x < 0 || p.x > canvas.width) p.speedX *= -1;
    if(p.y < 0 || p.y > canvas.height) p.speedY *= -1;

    const color = `hsl(${p.hue},100%,60%)`;

    ctx.beginPath();
    ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);

    ctx.fillStyle = color;
    ctx.shadowBlur = 25;
    ctx.shadowColor = color;
    ctx.fill();
  });

  requestAnimationFrame(drawParticles);
}

drawParticles();
</script>

</body>
</html>
</html>
