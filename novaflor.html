<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>NOVAFLOR</title>
  <style>
    body { 
      margin: 0; 
      background: transparent; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
      overflow: hidden; 
      font-family: Arial, sans-serif; 
    }
    
    /* Contenitore principale in primo piano */
    .container { 
      position: relative; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      width: 100%; 
      height: 100vh; 
      padding: 0 50px; 
      margin-top: 50px; 
      box-sizing: border-box; 
      z-index: 10; /* Tiene i player sopra le bolle */
    }
    .colonna-sx { display: flex; flex-direction: column; justify-content: center; }
    .colonna-dx { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    
    /* Il rettangolo della colonna sinistra */
    .wrapper-sx { 
        position: relative; 
        overflow: hidden; 
        border-radius: 22px; 
        width: 270px; 
        height: 484px; 
        box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        /* L'immagine fissa è stata rimossa, ora è gestita dal JavaScript! */
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }
    
    .wrapper { position: relative; overflow: hidden; border-radius: 22px; width: 270px; height: 484px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); background-color: #000; }
    
    @keyframes rainbow-bg { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
    @keyframes pulsante { 0% { transform: scale(1); opacity: 0.7; } 50% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(1); opacity: 0.7; } }
    .pulsing { animation: pulsante 2s ease-in-out infinite; }
    
    .wrapper::after, .wrapper-sx::after { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; box-sizing: border-box; border: 9px solid transparent; border-radius: 22px; background: linear-gradient(90deg, #ff0000, #ffaa00, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000) border-box; -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0); -webkit-mask-composite: destination-out; mask-composite: exclude; background-size: 200%; animation: rainbow-bg 3s linear infinite; z-index: 10; pointer-events: none; }
    
    .testo-arcobaleno { background: linear-gradient(90deg, #ff0000, #ffaa00, #ffff00, #00ffaa, #00aaff, #aa00ff, #ff0000); background-size: 200%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: rainbow-bg 3s linear infinite; }
    
    .left { background-color: transparent; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
    .right { background: transparent; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
    
    .saluto-testo { font-family: 'Arial Black', sans-serif; font-size: 20px; font-weight: 900; margin-bottom: 5px; text-transform: uppercase; }
    .datario-container { color: #fff; font-size: 16px; margin-bottom: 5px; font-weight: bold; text-transform: uppercase; }
    .orario-grande { font-family: 'Arial Black', sans-serif; font-size: 50px; font-weight: 900; margin-bottom: 5px; }
    
    .testo-dinamico-video { margin-bottom: 25px; font-family: 'Arial Black', sans-serif; font-size: 16px; color: #fff; text-transform: uppercase; letter-spacing: 2px; z-index: 5; background: rgba(0, 0, 0, 0.5); padding: 10px 20px; border-radius: 15px; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); box-shadow: 0 0 15px rgba(0,0,0,0.5); }
    .side-video { width: 100%; height: 100%; object-fit: cover; opacity: 1; border-radius: 22px; z-index: 1; position: absolute; top: 0; left: 0; }

    /* ========================================= */
    /* EFFETTO BOLLE D'ACQUA CON STELLE FLUTTUANTI */
    /* ========================================= */
    #bubble-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none; /* Rende le bolle non cliccabili */
      z-index: 1; /* Sullo sfondo rispetto ai riquadri */
    }

    .bubble {
      position: absolute;
      bottom: -100px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.6), rgba(255, 255, 255, 0.1) 40%, transparent 70%);
      backdrop-filter: blur(2px);
      animation: floatUp linear infinite;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* La stella luccicante dentro la bolla */
    .bubble::after {
      content: '✦';
      color: rgba(255, 255, 255, 0.9);
      position: absolute;
      top: 15%;
      left: 20%;
      text-shadow: 0 0 8px #fff, 0 0 15px #fff;
      animation: twinkle 1.5s infinite alternate;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.8) translateX(0); opacity: 0; }
      10% { opacity: 0.8; }
      90% { opacity: 0.8; }
      100% { transform: translateY(-120vh) scale(1.2) translateX(30px); opacity: 0; }
    }

    @keyframes twinkle {
      0% { opacity: 0.4; transform: scale(0.8) rotate(0deg); }
      100% { opacity: 1; transform: scale(1.3) rotate(15deg); }
    }
  </style>
</head>
<body>

  <!-- Contenitore delle Bolle -->
  <div id="bubble-container"></div>

  <div class="container">
    <div class="colonna-sx">
      <!-- Ho aggiunto l'ID "sfondo-sx" qui per il JavaScript -->
      <div id="sfondo-sx" class="wrapper-sx left">
        <div id="saluto-fisso" class="saluto-testo testo-arcobaleno">...</div>
        <div id="datario" class="datario-container">--/--/----</div>
        <div id="orario-grande" class="orario-grande testo-arcobaleno">00:00</div>
      </div>
    </div>

    <div class="colonna-dx">
      <div class="wrapper right">
        <video id="video-ragazze" class="side-video" autoplay loop playsinline></video>
        <div id="testo-sotto-video" class="testo-dinamico-video pulsing">...</div>
      </div>
    </div>
  </div>

  <script>
    /* ========================== */
    /* LOGICA BOLLE FLUTTUANTI    */
    /* ========================== */
    function creaBolle() {
      const container = document.getElementById('bubble-container');
      const colori = [
        'rgba(255, 0, 100, 0.5)',   /* Rosa neon */
        'rgba(0, 255, 255, 0.5)',   /* Ciano */
        'rgba(150, 0, 255, 0.5)',   /* Viola */
        'rgba(255, 255, 0, 0.5)',   /* Giallo */
        'rgba(0, 255, 100, 0.5)'    /* Verde acqua */
      ];

      setInterval(() => {
        const bubble = document.createElement('div');
        bubble.classList.add('bubble');
        
        const size = Math.random() * 60 + 30; 
        bubble.style.width = `${size}px`;
        bubble.style.height = `${size}px`;
        
        bubble.style.left = `${Math.random() * 100}vw`;
        
        const colore = colori[Math.floor(Math.random() * colori.length)];
        bubble.style.boxShadow = `inset 0 0 20px ${colore}, 0 0 10px ${colore}`;
        
        const duration = Math.random() * 6 + 6; 
        bubble.style.animationDuration = `${duration}s`;
        
        bubble.style.fontSize = `${size / 2.5}px`;

        container.appendChild(bubble);
        
        setTimeout(() => { bubble.remove(); }, duration * 1000);
      }, 400); 
    }

    creaBolle();


    /* ========================== */
    /* LOGICA VIDEO, ORARIO E GIF */
    /* ========================== */
    const videoRagazze = document.getElementById('video-ragazze');
    const testoSottoVideo = document.getElementById('testo-sotto-video');
    const sfondosSx = document.getElementById('sfondo-sx'); // Elemento che contiene la GIF
    let lastSaluto = "";
    let timerMuto = null;

    function avviaTimerMuto() {
      if (timerMuto) clearTimeout(timerMuto);
      timerMuto = setTimeout(() => {
        videoRagazze.muted = true;
      }, 11000); 
    }

    function sbloccaAudioInterazione() {
      if (videoRagazze.muted) {
        videoRagazze.muted = false;
        avviaTimerMuto();
      }
      document.removeEventListener('click', sbloccaAudioInterazione);
      document.removeEventListener('touchstart', sbloccaAudioInterazione);
    }
    document.addEventListener('click', sbloccaAudioInterazione);
    document.addEventListener('touchstart', sbloccaAudioInterazione);
    
    function updateData() {
      const now = new Date();
      document.getElementById('datario').innerText = now.toLocaleDateString('it-IT', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' });
      document.getElementById('orario-grande').innerText = now.toLocaleTimeString('it-IT', {hour: '2-digit', minute:'2-digit'});
            
      const hour = now.getHours();
      let saluto = "", videoUrl = "", gifUrl = "";
      
      // === IMPOSTA QUI I TUOI SALUTI, VIDEO E GIF PER OGNI FASCIA ORARIA ===
      if (hour >= 6 && hour < 12) { 
        saluto = "BUONGIORNO"; 
        videoUrl = "https://jaguaronero.github.io/hearts/01.mp4"; 
        gifUrl = "https://i.imgur.com/Otf2kms.gif"; /* <--- CAMBIA QUI LA GIF MATTINA */
      }
      else if (hour >= 12 && hour < 18) { 
        saluto = "BUON POMERIGGIO"; 
        videoUrl = "https://jaguaronero.github.io/hearts/02.mp4"; 
        gifUrl = "https://i.imgur.com/neEcOCY.gif"; /* <--- CAMBIA QUI LA GIF POMERIGGIO */
      }
      else if (hour >= 18 && hour < 24) { 
        saluto = "BUONASERA"; 
        videoUrl = "https://jaguaronero.github.io/hearts/03.mp4"; 
        gifUrl = "https://i.imgur.com/UbVvtRy.gif"; /* <--- CAMBIA QUI LA GIF SERA */
      }
      else { 
        saluto = "BUON ASCOLTO"; 
        videoUrl = "https://jaguaronero.github.io/hearts/04.mp4"; 
        gifUrl = "https://i.imgur.com/FgqOwIN.gif"; /* <--- CAMBIA QUI LA GIF NOTTE */
      }

      if (saluto !== lastSaluto) {
        document.getElementById('saluto-fisso').innerText = saluto;
        testoSottoVideo.innerText = saluto + "!";
        
        // Applica la GIF dinamicamente al cambio della fascia oraria
        sfondosSx.style.backgroundImage = `url('${gifUrl}')`;
        
        lastSaluto = saluto;
        
        videoRagazze.src = videoUrl;
        videoRagazze.load();
        
        videoRagazze.muted = false;
        
        videoRagazze.play()
          .then(() => {
            avviaTimerMuto();
          })
          .catch(() => {
            videoRagazze.muted = true;
            videoRagazze.play().catch(() => {});
          });
      }
    }

    updateData();
    setInterval(updateData, 1000);
  </script>
</body>
</html>
