<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Radar Clock</title>
  <style>
    body {
      margin: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: monospace;
    }

    canvas {
      background: radial-gradient(circle at center, #003300 0%, #001a00 70%, #000 100%);
      border-radius: 50%;
      box-shadow: 0 0 40px #00ff66;
    }
  </style>
</head>
<body>

<canvas id="radar" width="450" height="450"></canvas>

<script>
  const canvas = document.getElementById("radar");
  const ctx = canvas.getContext("2d");
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const radius = canvas.width / 2 - 25;

  // Creiamo 24 stelle con posizione casuale e fase per scintillio
  const stars = Array.from({ length: 24 }, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    size: Math.random() * 2 + 1,
    phase: Math.random() * Math.PI * 2,
    speedX: (Math.random() - 0.5) * 0.2,
    speedY: (Math.random() - 0.5) * 0.2
  }));

  function drawStars() {
    stars.forEach(star => {
      // Scintillio variabile
      const brightness = 0.5 + 0.5 * Math.sin(star.phase);
      ctx.fillStyle = `rgba(0,255,102,${brightness})`;

      ctx.beginPath();
      ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
      ctx.fill();

      // Aggiorniamo fase per scintillio
      star.phase += 0.05;

      // Movimento lento "galleggiante"
      star.x += star.speedX;
      star.y += star.speedY;

      // Manteniamo le stelle dentro il canvas
      if (star.x < 0) star.x = canvas.width;
      if (star.x > canvas.width) star.x = 0;
      if (star.y < 0) star.y = canvas.height;
      if (star.y > canvas.height) star.y = 0;
    });
  }

  function drawGrid() {
    ctx.strokeStyle = "rgba(0,255,100,0.25)";
    ctx.lineWidth = 1;

    for (let i = 1; i <= 4; i++) {
      ctx.beginPath();
      ctx.arc(cx, cy, (radius / 4) * i, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.beginPath();
    ctx.moveTo(cx - radius, cy);
    ctx.lineTo(cx + radius, cy);
    ctx.moveTo(cx, cy - radius);
    ctx.lineTo(cx, cy + radius);
    ctx.stroke();
  }

  function drawNumbers() {
    ctx.font = "18px monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    for (let n = 1; n <= 12; n++) {
      const angle = (n / 12) * Math.PI * 2 - Math.PI / 2;
      const x = cx + Math.cos(angle) * (radius - 20);
      const y = cy + Math.sin(angle) * (radius - 20);

      ctx.fillStyle = "#00ff66";
      ctx.shadowColor = "#00ff66";
      ctx.shadowBlur = 15;
      ctx.fillText(n.toString(), x, y);
    }

    ctx.shadowBlur = 0;
  }

  function drawHand(angle, length, width, glow) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angle);

    ctx.strokeStyle = "#00ff66";
    ctx.lineWidth = width;
    ctx.shadowColor = "#00ff66";
    ctx.shadowBlur = glow;

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(length, 0);
    ctx.stroke();

    ctx.restore();
    ctx.shadowBlur = 0;
  }

  function drawSweep(angle) {
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
    grad.addColorStop(0, "rgba(0,255,100,0.5)");
    grad.addColorStop(1, "rgba(0,255,100,0)");

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, radius, angle - 0.05, angle);
    ctx.closePath();
    ctx.fill();
  }

  function drawCenterText() {
    const text = "GO TO MUSIC";
    ctx.font = "24px monospace";
    ctx.fillStyle = "#00ff66";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.shadowColor = "#00ff66";
    ctx.shadowBlur = 20;
    ctx.fillText(text, cx, cy);
    ctx.shadowBlur = 0;
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    drawStars();       // STELLE SCINTILLANTI GALLEGGIANTI
    drawGrid();
    drawNumbers();
    drawCenterText();

    const now = new Date();
    const sec = now.getSeconds() + now.getMilliseconds() / 1000;
    const min = now.getMinutes() + sec / 60;
    const hr = (now.getHours() % 12) + min / 60;

    const secAngle = (sec / 60) * Math.PI * 2 - Math.PI / 2;
    const minAngle = (min / 60) * Math.PI * 2 - Math.PI / 2;
    const hrAngle = (hr / 12) * Math.PI * 2 - Math.PI / 2;

    drawHand(hrAngle, radius * 0.45, 5, 20);
    drawHand(minAngle, radius * 0.65, 3, 15);
    drawSweep(secAngle);

    requestAnimationFrame(draw);
  }

  draw();
</script>

</body>
</html>
