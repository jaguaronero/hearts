<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doppio Speaker Arcobaleno</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:;
    overflow:auto;
    font-family:Arial, sans-serif;
    padding:40px 0;
}

/* CONTENITORE */
.wrapper{
    display:flex;
    flex-direction:column;
    gap:60px;
}

/* OUTER BOX */
.outer-rainbow-box{
    position:relative;
    width:640px;
    height:480px;
    padding:4px;
    border-radius:35px;

    background:linear-gradient(
        90deg,
        #ff0000,
        #ff7b00,
        #ffee00,
        #00ff88,
        #00d9ff,
        #0044ff,
        #7a00ff,
        #ff00c8,
        #ff0000
    );

    background-size:500%;

    animation:
        rainbowOuter 5s linear infinite,
        glowOuter 2s ease-in-out infinite alternate;

    display:flex;
    justify-content:center;
    align-items:center;

    box-shadow:
        0 0 20px rgba(255,0,255,0.4),
        0 0 40px rgba(0,255,255,0.3),
        0 0 60px rgba(255,255,255,0.2);
}

.outer-rainbow-box::before{
    content:"";
    position:absolute;
    inset:4px;
    background:#141414;
    border-radius:31px;
}

/* SPEAKERS */
.speaker{
    position:absolute;
    left:540px;

    width:60px;
    height:60px;

    z-index:9999;

    display:flex;
    justify-content:center;
    align-items:center;
}

/* PRIMO SPEAKER */
.speaker-top{
    top:63px;
}

/* SECONDO SPEAKER */
.speaker-bottom{
    top:160px;
}

.speaker-core{
    width:24px;
    height:24px;
    border-radius:50%;

    background:linear-gradient(
        45deg,
        red,
        orange,
        yellow,
        lime,
        cyan,
        blue,
        violet
    );

    background-size:400%;

    animation:
        rainbow 3s linear infinite,
        pulseSpeaker 1s infinite ease-in-out;

    box-shadow:
        0 0 10px rgba(255,0,255,0.6),
        0 0 25px rgba(0,255,255,0.5);
}

.wave{
    position:absolute;

    border:3px solid rgba(255,255,255,0.8);
    border-radius:50%;

    animation:waveAnim 2s infinite;
}

.wave1{
    width:35px;
    height:35px;
}

.wave2{
    width:50px;
    height:50px;
    animation-delay:0.5s;
}

.wave3{
    width:65px;
    height:65px;
    animation-delay:1s;
}

/* VIDEO BOX */
.rainbow-box{
    position:absolute;
    right:18px;
    width:570px;
    height:370px;

    border-radius:28px;
    overflow:hidden;
    padding:4px;
    z-index:2;

    background:linear-gradient(
        90deg,
        red, orange, yellow, lime, cyan, blue, violet, red
    );

    background-size:400%;

    animation:
        rainbow 3s linear infinite,
        glowInner 2s ease-in-out infinite alternate;

    box-shadow:
        0 0 15px rgba(255,0,255,0.5),
        0 0 35px rgba(0,255,255,0.3);
}

.rainbow-box::before{
    content:"";
    position:absolute;
    inset:4px;
    background:;
    border-radius:24px;
    z-index:1;
}

.video-container{
    position:relative;
    width:100%;
    height:100%;
    z-index:2;
    border-radius:24px;
    overflow:hidden;
}

.video-container video{
    width:100%;
    height:100%;
    object-fit:contain;     /* Mostra il video intero al 100% senza tagliare nulla */
    object-position:center;  /* Lo mantiene perfettamente centrato nel box */
    display:block;
    background:;
}

/* SCRITTA FATY (SINISTRA) */
.welcome-faty {
    position:absolute;
    left:85px;              /* Spostata più a destra (prima era 18px) */
    top:65px;
    width:90px;             /* Allargata leggermente per contenere il font più grande */
    z-index:10;
    font-size:19px;         /* Size aumentata (prima era 14px) */
    font-weight:bold;
    text-align:center;
    line-height:1.4;
    letter-spacing:1px;

    background:linear-gradient(
        90deg,
        red,
        orange,
        yellow,
        lime,
        cyan,
        blue,
        violet,
        red
    );
    background-size:400%;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:rainbowText 4s linear infinite;
}

/* BUTTONS */
.controls{
    position:absolute;
    left:32px;              /* Spostati leggermente a destra per allinearsi alla scritta */
    top:58%;
    transform:translateY(-50%);
    z-index:10;

    display:flex;
    flex-direction:column;
    gap:14px;
}

.control-btn{
    width:70px;
    height:70px;
    border:none;
    border-radius:20px;
    color:white;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;

    background:linear-gradient(
        90deg,
        red,
        orange,
        yellow,
        lime,
        cyan,
        blue,
        violet,
        red
    );

    background-size:400%;
    animation:rainbow 3s linear infinite;

    box-shadow:
        0 0 10px rgba(255,0,255,0.5),
        0 0 20px rgba(0,255,255,0.3);
}

/* CLOCK */
.clock-box{
    position:absolute;
    bottom:18px;
    left:18px;
    z-index:5;

    display:flex;
    align-items:center;
    gap:12px;

    padding:8px 9px;
    border-radius:16px;

    background:rgba(0,0,0,0.45);
    backdrop-filter:blur(10px);

    border:4px solid transparent;

    background-image:
        linear-gradient(#111,#111),
        linear-gradient(
            90deg,
            red,
            orange,
            yellow,
            lime,
            cyan,
            blue,
            violet,
            red
        );

    background-origin:border-box;
    background-clip:padding-box, border-box;

    animation:rainbowBorder 3s linear infinite;
}

.clock{
    color:white;
    line-height:1.3;
}

#time{
    font-size:20px;
    font-weight:bold;
}

#date{
    font-size:11px;
    color:#dcdcdc;
}

/* GO TO MUSIC */
.go-music{
    position:absolute;
    top:10px;
    left:50%;
    transform:translateX(-50%);

    z-index:9999;

    font-size:26px;
    font-weight:bold;
    letter-spacing:2px;

    background:linear-gradient(
        90deg,
        red,
        orange,
        yellow,
        lime,
        cyan,
        blue,
        violet,
        red
    );

    background-size:400%;

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    animation:rainbowText 4s linear infinite;
}

/* VOLUME */
.volume-box{
    position:absolute;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);

    display:flex;
    align-items:center;
    gap:8px;

    color:white;
    font-size:13px;

    padding:6px 10px;
    border-radius:10px;

    background:rgba(0,0,0,0.35);
    backdrop-filter:blur(8px);
}

/* EQUALIZER */
.equalizer{
    position:absolute;
    right:35px;
    top:360px;

    width:120px;
    height:35px;

    display:flex;
    align-items:flex-end;
    justify-content:space-between;

    z-index:9999;
}

.equalizer span{
    width:5px;
    border-radius:10px;

    background:linear-gradient(
        to top,
        red,
        orange,
        yellow,
        lime,
        cyan
    );

    animation:eq 1s infinite ease-in-out;
}

.equalizer span:nth-child(1){ height:10px; animation-delay:0s; }
.equalizer span:nth-child(2){ height:18px; animation-delay:0.1s; }
.equalizer span:nth-child(3){ height:26px; animation-delay:0.2s; }
.equalizer span:nth-child(4){ height:15px; animation-delay:0.3s; }
.equalizer span:nth-child(5){ height:30px; animation-delay:0.4s; }
.equalizer span:nth-child(6){ height:14px; animation-delay:0.5s; }
.equalizer span:nth-child(7){ height:24px; animation-delay:0.6s; }
.equalizer span:nth-child(8){ height:18px; animation-delay:0.7s; }
.equalizer span:nth-child(9){ height:28px; animation-delay:0.8s; }
.equalizer span:nth-child(10){ height:12px; animation-delay:0.9s; }
.equalizer span:nth-child(11){ height:22px; animation-delay:1s; }
.equalizer span:nth-child(12){ height:16px; animation-delay:1.1s; }

/* ANIMAZIONI */

@keyframes pulseSpeaker{
    0%{ transform:scale(1); }
    50%{ transform:scale(1.25); }
    100%{ transform:scale(1); }
}

@keyframes waveAnim{
    0%{
        transform:scale(0.7);
        opacity:1;
    }

    100%{
        transform:scale(1.4);
        opacity:0;
    }
}

@keyframes eq{
    0%{
        transform:scaleY(0.4);
        opacity:0.5;
    }

    50%{
        transform:scaleY(1.3);
        opacity:1;
    }

    100%{
        transform:scaleY(0.4);
        opacity:0.5;
    }
}

@keyframes glowOuter{
    from{
        box-shadow:
            0 0 20px rgba(255,0,255,0.4),
            0 0 40px rgba(0,255,255,0.3);
    }

    to{
        box-shadow:
            0 0 35px rgba(255,0,255,0.8),
            0 0 70px rgba(0,255,255,0.6);
    }
}

@keyframes glowInner{
    from{
        box-shadow:
            0 0 15px rgba(255,0,255,0.5),
            0 0 35px rgba(0,255,255,0.3);
    }

    to{
        box-shadow:
            0 0 30px rgba(255,0,255,0.9),
            0 0 60px rgba(0,255,255,0.7);
    }
}

@keyframes rainbowText{
    0%{ background-position:0%; }
    100%{ background-position:400%; }
}

@keyframes scrollText{
    0%{ transform:translateX(0); }
    100%{ transform:translateX(-100%); }
}

@keyframes rainbow{
    0%{ background-position:0%; }
    100%{ background-position:400%; }
}

@keyframes rainbowOuter{
    0%{ background-position:0%; }
    100%{ background-position:500%; }
}

@keyframes rainbowBorder{
    0%{ background-position:0%; }
    100%{ background-position:300%; }
}

</style>
</head>

<body>

<div class="wrapper">

    <audio id="radioStream">
        <source src="https://anjovipvendas.top:8008/stream" type="audio/mpeg">
    </audio>

    <div class="outer-rainbow-box">

        <div class="welcome-faty">
            Dj FATY <br>Obrigado a todos.
        </div>

        <div class="speaker speaker-top">
            <div class="speaker-core"></div>

            <span class="wave wave1"></span>
            <span class="wave wave2"></span>
            <span class="wave wave3"></span>
        </div>

        <div class="speaker speaker-bottom">
            <div class="speaker-core"></div>

            <span class="wave wave1"></span>
            <span class="wave wave2"></span>
            <span class="wave wave3"></span>
        </div>

        <div class="controls">
            <button class="control-btn" onclick="playVideo(); play();">PLAY</button>
            <button class="control-btn" onclick="stopVideo(); stop();">STOP</button>
        </div>

        <div class="rainbow-box">
            <div class="video-container">
                <video id="myVideo" autoplay muted loop playsinline>
                    <source src="https://i.imgur.com/52KxdP4.mp4">
                </video>
            </div>
        </div>

        <div class="clock-box">
            <div class="clock">
                <div id="time">00:00:00</div>
                <div id="date">Caricamento...</div>
            </div>
        </div>

        <div class="go-music">
            Radio Diabrete
        </div>

        <div class="equalizer">
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
        </div>

        <div class="volume-box">
            🔊
            <input type="range"
                min="0"
                max="1"
                step="0.01"
                value="0.5"
                oninput="changeVolume(this.value)">
        </div>

    </div>

</div>

<script>

const video = document.getElementById("myVideo");
const stream = document.getElementById("radioStream");

function playVideo(){
    video.play();
}

function stopVideo(){
    video.pause();
    video.currentTime = 0;
}

function play(){
    stream.play().catch(function(error) {
        console.log("Riproduzione bloccata dal browser, richiede azione utente:", error);
    });
}

function stop(){
    stream.pause();
    stream.load(); 
}

function changeVolume(value){
    stream.volume = value;
}

/* CLOCK */
function aggiornaOra(){

    const now = new Date();

    const giorni = [
        "Domingo",
        "Segunda-feira",
        "Terça-feira",
        "Quarta-feira",
        "Quinta-feira",
        "Sexta-feira",
        "Sábado"
    ];

    const mesi = [
        "Janeiro",
        "Fevereiro",
        "Março",
        "Abril",
        "Maio",
        "Junho",
        "Julho",
        "Agosto",
        "Setembro",
        "Outubro",
        "Novembro",
        "Dezembro"
    ];

    const giorno = giorni[now.getDay()];
    const data = now.getDate();
    const mese = mesi[now.getMonth()];
    const anno = now.getFullYear();

    const ore = String(now.getHours()).padStart(2,'0');
    const minuti = String(now.getMinutes()).padStart(2,'0');
    const secondi = String(now.getSeconds()).padStart(2,'0');

    document.getElementById("time").innerHTML = `${ore}:${minuti}:${secondi}`;
    document.getElementById("date").innerHTML = `${giorno}, <br>${data} de ${mese} de ${anno}`;
}

setInterval(aggiornaOra, 1000);
aggiornaOra();

</script>

</body>
</html>
