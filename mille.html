<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌈 Rainbow Radio Player</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#050505;
    overflow:hidden;
}

/* PLAYER */
.player{
    width:460px;
    padding:25px;
    border-radius:35px;
    position:relative;
    overflow:hidden;
    background:rgba(0,0,0,0.88);

    border:4px solid transparent;

    background-image:
    linear-gradient(rgba(0,0,0,0.88), rgba(0,0,0,0.88)),
    linear-gradient(
        45deg,
        #ff0000,
        #ff8800,
        #ffee00,
        #00ff00,
        #00ffee,
        #0066ff,
        #9900ff,
        #ff00aa,
        #ff0000
    );

    background-origin:border-box;
    background-clip:padding-box, border-box;

    animation:rainbowBorder 6s linear infinite;

    box-shadow:
    0 0 25px rgba(255,0,255,0.8),
    0 0 45px rgba(0,255,255,0.8),
    0 0 65px rgba(255,255,255,0.3);
}

/* LOGO IN ALTO A DESTRA */
.logo-top-right{
    position:absolute;
    top:20px;
    right:15px;
    width:65px;
    height:auto;
    border-radius:15px;
    box-shadow:
        0 0 15px cyan,
        0 0 25px magenta,
        0 0 35px yellow;
    animation:logoPulse 2s infinite alternate;
    z-index:999;
}

@keyframes logoPulse{

    from{
        transform:scale(1) rotate(0deg);
        filter:brightness(1);
    }

    to{
        transform:scale(1.08) rotate(2deg);
        filter:brightness(1.3);
    }

}

/* ANIMAZIONE ARCOBALENO */
@keyframes rainbowBorder{

    0%{
        filter:hue-rotate(0deg);
    }

    100%{
        filter:hue-rotate(360deg);
    }

}

/* GLOW ESTERNO */
.player::before{
    content:"";
    position:absolute;
    inset:-10px;
    border-radius:40px;
    background:linear-gradient(
        90deg,
        red,
        orange,
        yellow,
        lime,
        cyan,
        blue,
        violet,
        red
    );
    z-index:-1;
    filter:blur(25px);
    opacity:0.8;
    animation:glowMove 8s linear infinite;
    background-size:400%;
}

@keyframes glowMove{

    0%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0% 50%;
    }

}

/* TITOLO */
.title{
    text-align:center;
    color:white;
    font-size:30px;
    font-weight:bold;
    margin-bottom:10px;
    text-shadow:0 0 20px cyan;
}

/* JAGUARO */
.jaguaro{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    color:#ff00ff;
    margin-bottom:15px;
    text-shadow:
        0 0 10px #ff00ff,
        0 0 20px cyan,
        0 0 30px yellow;
    animation:blink 1s infinite;
}

@keyframes blink{

    0%{
        opacity:1;
        transform:scale(1);
    }

    50%{
        opacity:0.2;
        transform:scale(1.1);
    }

    100%{
        opacity:1;
        transform:scale(1);
    }

}

/* DATA E ORA */
.datetime{
    text-align:center;
    color:#00ffff;
    font-size:18px;
    margin-bottom:20px;
    text-shadow:0 0 10px cyan;
    font-weight:bold;
}

/* ALTOPARLANTI */
.speaker-box{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.speaker{
    width:90px;
    height:90px;
    border-radius:50%;
    background:
    radial-gradient(circle,#444 10%,#111 45%,#000 70%);
    border:5px solid #666;
    position:relative;
    animation:speakerPulse 1s infinite alternate;
    box-shadow:
    0 0 20px cyan,
    0 0 30px magenta;
}

.speaker::before{
    content:"";
    position:absolute;
    width:35px;
    height:35px;
    background:#111;
    border-radius:50%;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    border:3px solid #888;
}

@keyframes speakerPulse{
    from{
        transform:scale(1);
        box-shadow:0 0 15px cyan;
    }
    to{
        transform:scale(1.08);
        box-shadow:0 0 30px magenta;
    }
}

/* EQUALIZER */
.equalizer{
    display:flex;
    justify-content:center;
    align-items:flex-end;
    gap:8px;
    height:100px;
    margin:20px 0;
}

.bar{
    width:12px;
    border-radius:20px;
    background:linear-gradient(to top, cyan, magenta, yellow);
    animation:equalizer 1s infinite ease-in-out;
}

.bar:nth-child(1){height:40px; animation-delay:0.1s;}
.bar:nth-child(2){height:80px; animation-delay:0.2s;}
.bar:nth-child(3){height:55px; animation-delay:0.3s;}
.bar:nth-child(4){height:90px; animation-delay:0.4s;}
.bar:nth-child(5){height:60px; animation-delay:0.5s;}
.bar:nth-child(6){height:75px; animation-delay:0.6s;}
.bar:nth-child(7){height:50px; animation-delay:0.7s;}
.bar:nth-child(8){height:95px; animation-delay:0.8s;}

@keyframes equalizer{
    0%,100%{
        transform:scaleY(0.4);
        filter:hue-rotate(0deg);
    }
    50%{
        transform:scaleY(1.5);
        filter:hue-rotate(180deg);
    }
}

/* CONTROLLI */
.controls{
    display:flex;
    justify-content:center;
    gap:15px;
    margin-top:20px;
}

button{
    border:none;
    padding:13px 18px;
    border-radius:15px;
    cursor:pointer;
    color:white;
    font-weight:bold;
    font-size:15px;
    background:linear-gradient(45deg,#ff00ff,#00ffff);
    box-shadow:0 0 20px cyan;
    transition:0.3s;
}

button:hover{
    transform:scale(1.1);
}

/* VOLUME */
.volume-box{
    margin-top:25px;
    text-align:center;
    color:white;
}

#volume{
    width:85%;
    margin-top:12px;
    cursor:pointer;
    accent-color:cyan;
}

/* STATUS */
.status{
    text-align:center;
    margin-top:18px;
    color:#00ffff;
    font-size:15px;
    text-shadow:0 0 10px cyan;
}

</style>
</head>
<body>

<div class="player">

    <!-- LOGO -->
    <img
    src="https://xatimg.com/image/2SpWunVLCY0j.png"
    class="logo-top-right"
    alt="Logo">

    <div class="title">🌈 MILLE RICORDI</div>

    <!-- JAGUARO -->
    <div class="jaguaro">⚡ JAGUARO ⚡</div>

    <!-- DATA E ORA -->
    <div class="datetime" id="datetime">
        Caricamento data e ora...
    </div>

    <!-- SPEAKERS -->
    <div class="speaker-box">

        <div class="speaker"></div>

        <!-- EQUALIZER -->
        <div class="equalizer">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>

        <div class="speaker"></div>

    </div>

    <!-- CONTROLLI -->
    <div class="controls">
        <button onclick="playRadio()">▶ PLAY</button>
        <button onclick="pauseRadio()">⏸ PAUSA</button>
        <button onclick="stopRadio()">⏹ STOP</button>
    </div>

    <!-- VOLUME -->
    <div class="volume-box">
        🔊 CONTROLLO VOLUME
        <br>
        <input type="range"
               id="volume"
               min="0"
               max="100"
               value="100">
    </div>

    <!-- STATUS -->
    <div class="status" id="status">
        🔴 Radio pronta
    </div>

</div>

<!-- AUDIO STREAM -->
<audio id="radio" crossorigin="anonymous">

<source src="https://node-14.zeno.fm/xh0txuqr0v8uv?zs=KULRBS6sQcGK70KY33r7IQ&rj-tok=AAABgDktPVMA09m2cc37_h6yBA&rj-ttl=5" type="audio/mpeg">

</audio>

<script>

const radio = document.getElementById("radio");
const statusText = document.getElementById("status");
const volumeSlider = document.getElementById("volume");
const datetimeBox = document.getElementById("datetime");

/* VOLUME INIZIALE */
radio.volume = 1;

/* PLAY */
function playRadio(){

    radio.play()
    .then(() => {

        statusText.innerHTML = "🟢 RADIO LIVE IN RIPRODUZIONE";

    })
    .catch((error) => {

        statusText.innerHTML = "❌ ERRORE AVVIO STREAM";
        console.log(error);

    });

}

/* PAUSA */
function pauseRadio(){

    radio.pause();

    statusText.innerHTML = "⏸ RADIO IN PAUSA";

}

/* STOP */
function stopRadio(){

    radio.pause();

    radio.load();

    statusText.innerHTML = "🔴 RADIO FERMATA";

}

/* CONTROLLO VOLUME */
volumeSlider.addEventListener("input", function(){

    radio.volume = this.value / 100;

});

/* ERRORI STREAM */
radio.addEventListener("error", function(){

    statusText.innerHTML = "❌ STREAM NON DISPONIBILE";

});

/* STREAM CARICATO */
radio.addEventListener("loadeddata", function(){

    statusText.innerHTML = "🟡 STREAM CARICATO";

});

/* DATA E ORA ITALIANA */
function aggiornaDataOra(){

    const now = new Date();

    const opzioni = {
        weekday: 'long',
        day: '2-digit',
        month: 'long',
        year: 'numeric'
    };

    const data = now.toLocaleDateString('it-IT', opzioni);

    const ora = now.toLocaleTimeString('it-IT');

    datetimeBox.innerHTML =
        "📅 " + data +
        "<br>🕒 " + ora;

}

/* AGGIORNA OGNI SECONDO */
setInterval(aggiornaDataOra, 1000);

aggiornaDataOra();

</script>

</body>
</html>
