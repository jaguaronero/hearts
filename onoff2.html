<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>FERNY-JAGUARO</title>
  <style>
    body { margin: 0; background: transparent; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: Arial, sans-serif; }
    .container { position: relative; display: flex; justify-content: space-between; align-items: center; width: 100%; height: 100vh; padding: 0 50px; margin-top: 50px; box-sizing: border-box; }
    .colonna-sx { display: flex; flex-direction: column; justify-content: center; }
    .colonna-dx { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    
    /* Il rettangolo della colonna sinistra */
    .wrapper-sx { 
        position: relative; 
        overflow: hidden; 
        border-radius: 22px; 
        width: 270px; 
        height: 484px; 
        box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        background-image: url('https://xatimg.com/image/Ff6KClg72VrY.gif');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }
    
    .wrapper { position: relative; overflow: hidden; border-radius: 22px; width: 270px; height: 484px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); background-color: #000; }
    
    @keyframes rainbow-bg { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
    @keyframes pulsante { 0% { transform: scale(1); opacity: 0.7; } 50% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(1); opacity: 0.7; } }
    .pulsing { animation: pulsante 2s ease-in-out infinite; }
    
    .wrapper::after, .wrapper-sx::after { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; box-sizing: border-box; border: 9px solid transparent; border-radius: 22px; background: linear-gradient(90deg, #ff0000, #ffaa00, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000) border-box; -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0); -webkit-mask-composite: destination-out; mask-composite: exclude; background-size: 200%; animation: rainbow-bg 3s linear infinite; z-index: 10; pointer-events: none; }
    
    .testo-arcobaleno { background: linear-gradient(90deg, #ff0000, #ffaa00, #ffff00, #00ffaa, #00aaff, #aa00ff, #ff0000); background-size: 200%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: rainbow-bg 3s linear infinite; }
    
    .left { background-color: transparent; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
    .right { background: transparent; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
    
    .saluto-testo { font-family: 'Arial Black', sans-serif; font-size: 20px; font-weight: 900; margin-bottom: 5px; text-transform: uppercase; }
    .datario-container { color: #fff; font-size: 16px; margin-bottom: 5px; font-weight: bold; text-transform: uppercase; }
    .orario-grande { font-family: 'Arial Black', sans-serif; font-size: 50px; font-weight: 900; margin-bottom: 5px; }
    
    .testo-dinamico-video { margin-bottom: 25px; font-family: 'Arial Black', sans-serif; font-size: 16px; color: #fff; text-transform: uppercase; letter-spacing: 2px; z-index: 5; background: rgba(0, 0, 0, 0.5); padding: 10px 20px; border-radius: 15px; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); box-shadow: 0 0 15px rgba(0,0,0,0.5); }
    .side-video { width: 100%; height: 100%; object-fit: cover; opacity: 1; border-radius: 22px; z-index: 1; position: absolute; top: 0; left: 0; }
  </style>
</head>
<body>

  <div class="container">
    <div class="colonna-sx">
      <div class="wrapper-sx left">
        <div id="saluto-fisso" class="saluto-testo testo-arcobaleno">...</div>
        <div id="datario" class="datario-container">--/--/----</div>
        <div id="orario-grande" class="orario-grande testo-arcobaleno">00:00</div>
        <div class="data-info" style="color:#fff">
          <div id="citta-visitatore" style="color:#00ffff; font-weight:bold; text-transform: uppercase; margin-top: 5px;">Caricamento...</div>
        </div>
      </div>
    </div>

    <div class="colonna-dx">
      <div class="wrapper right">
        <video id="video-ragazze" class="side-video" autoplay loop playsinline></video>
        <div id="testo-sotto-video" class="testo-dinamico-video pulsing">...</div>
      </div>
    </div>
  </div>

  <script>
    const videoRagazze = document.getElementById('video-ragazze');
    const testoSottoVideo = document.getElementById('testo-sotto-video');
    let lastSaluto = "";
    let timerMuto = null;

    // Funzione che attiva il countdown di 11 secondi per silenziare il video
    function avviaTimerMuto() {
      if (timerMuto) clearTimeout(timerMuto);
      timerMuto = setTimeout(() => {
        videoRagazze.muted = true;
      }, 11000); // 11000 millisecondi = 11 secondi
    }

    // Interazione d'emergenza: se il browser blocca l'audio iniziale, si attiva al primo tocco sulla pagina
    function sbloccaAudioInterazione() {
      if (videoRagazze.muted) {
        videoRagazze.muted = false;
        avviaTimerMuto();
      }
      document.removeEventListener('click', sbloccaAudioInterazione);
      document.removeEventListener('touchstart', sbloccaAudioInterazione);
    }
    document.addEventListener('click', sbloccaAudioInterazione);
    document.addEventListener('touchstart', sbloccaAudioInterazione);

    /* GEOLOCALIZZAZIONE INTELLIGENTE CON TRIPLE-FALLBACK */
    function ottieniCittaGeolocal() {
      const cittaElement = document.getElementById('citta-visitatore');
      
      function usaGeolocalizzazioneIP() {
        fetch('https://ipwhois.app/json/')
          .then(res => res.json())
          .then(data => {
            if (data && data.city) { cittaElement.innerText = data.city; } else { throw new Error(); }
          })
          .catch(() => {
            fetch('https://free.freeipapi.com/api/json/')
              .then(res => res.json())
              .then(data2 => {
                if (data2 && data2.cityName) { cittaElement.innerText = data2.cityName; } else { throw new Error(); }
              })
              .catch(() => {
                fetch('https://ipapi.co/json/')
                  .then(res => res.json())
                  .then(data3 => { cittaElement.innerText = data3.city || "Mondo"; })
                  .catch(() => { cittaElement.innerText = "Mondo"; });
              });
          });
      }

      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${position.coords.latitude}&lon=${position.coords.longitude}&zoom=10&addressdetails=1`)
              .then(res => res.json())
              .then(data => {
                cittaElement.innerText = data.address.city || data.address.town || data.address.village || "Mondo";
              })
              .catch(() => { usaGeolocalizzazioneIP(); });
          },
          () => { usaGeolocalizzazioneIP(); },
          { timeout: 3000, enableHighAccuracy: false, maximumAge: 60000 }
        );
      } else {
        usaGeolocalizzazioneIP();
      }
    }

    ottieniCittaGeolocal();
    
    /* GESTIONE ORARIO E RIPRODUZIONE VIDEO AVANZATA */
    function updateData() {
      const now = new Date();
      document.getElementById('datario').innerText = now.toLocaleDateString('it-IT', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' });
      document.getElementById('orario-grande').innerText = now.toLocaleTimeString('it-IT', {hour: '2-digit', minute:'2-digit'});
            
      const hour = now.getHours();
      let saluto = "", videoUrl = "";
      
      if (hour >= 6 && hour < 12) { saluto = "BUONGIORNO"; videoUrl = "https://i.imgur.com/dRXFuYY.mp4"; }
      else if (hour >= 12 && hour < 18) { saluto = "BUON POMERIGGIO"; videoUrl = "https://i.imgur.com/s0tGoNn.mp4"; }
      else if (hour >= 18 && hour < 24) { saluto = "BUONASERA"; videoUrl = "https://i.imgur.com/c4FPKDZ.mp4"; }
      else { saluto = "BUON ASCOLTO"; videoUrl = "https://i.imgur.com/SXKPrwy.mp4"; }

      if (saluto !== lastSaluto) {
        document.getElementById('saluto-fisso').innerText = saluto;
        testoSottoVideo.innerText = saluto + "!";
        lastSaluto = saluto;
        
        // Carica il video direttamente sulla sorgente principale
        videoRagazze.src = videoUrl;
        videoRagazze.load();
        
        // Proviamo a far partire il video ad audio aperto
        videoRagazze.muted = false;
        
        videoRagazze.play()
          .then(() => {
            // Se l'autoplay con audio è concesso dal browser, facciamo partire il timer dei 11 secondi
            avviaTimerMuto();
          })
          .catch(() => {
            // Se il browser blocca l'audio automatico, facciamo partire il video MUTO per renderlo visibile
            // L'audio si attiverà al primo micro-click dell'utente sulla pagina
            videoRagazze.muted = true;
            videoRagazze.play().catch(() => {});
          });
      }
    }

    updateData();
    setInterval(updateData, 1000);
  </script>
</body>
</html>
