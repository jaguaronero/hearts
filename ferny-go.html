<!DOCTYPE html>
<html lang="it">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ferny-go</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: transparent;
}

/* ANIMAZIONE ARCOBALENO PER IL GLOW E I BORDI */
@keyframes rainbowGlow {
    0% {
        border-color: #ff0000;
        box-shadow: 0 0 25px #ff0000, 0 0 50px #ff0000, inset 0 0 15px #ff0000;
    }
    16% {
        border-color: #ff7f00;
        box-shadow: 0 0 25px #ff7f00, 0 0 50px #ff7f00, inset 0 0 15px #ff7f00;
    }
    33% {
        border-color: #ffff00;
        box-shadow: 0 0 25px #ffff00, 0 0 50px #ffff00, inset 0 0 15px #ffff00;
    }
    50% {
        border-color: #00ff00;
        box-shadow: 0 0 25px #00ff00, 0 0 50px #00ff00, inset 0 0 15px #00ff00;
    }
    66% {
        border-color: #0000ff;
        box-shadow: 0 0 25px #0000ff, 0 0 50px #0000ff, inset 0 0 15px #0000ff;
    }
    83% {
        border-color: #4b0082;
        box-shadow: 0 0 25px #4b0082, 0 0 50px #4b0082, inset 0 0 15px #4b0082;
    }
    100% {
        border-color: #8b00ff;
        box-shadow: 0 0 25px #8b00ff, 0 0 50px #8b00ff, inset 0 0 15px #8b00ff;
    }
}

/* ANIMAZIONE ARCOBALENO PER IL TESTO */
@keyframes rainbowText {
    0% {
        color: #ff0000;
        text-shadow: 0 0 10px #ff0000, 0 0 25px #ff0000, 0 0 35px #ffffff;
    }
    16% {
        color: #ff7f00;
        text-shadow: 0 0 10px #ff7f00, 0 0 25px #ff7f00, 0 0 35px #ffffff;
    }
    33% {
        color: #ffff00;
        text-shadow: 0 0 10px #ffff00, 0 0 25px #ffff00, 0 0 35px #ffffff;
    }
    50% {
        color: #00ff00;
        text-shadow: 0 0 10px #00ff00, 0 0 25px #00ff00, 0 0 35px #ffffff;
    }
    66% {
        color: #0000ff;
        text-shadow: 0 0 10px #0000ff, 0 0 25px #0000ff, 0 0 35px #ffffff;
    }
    83% {
        color: #4b0082;
        text-shadow: 0 0 10px #4b0082, 0 0 25px #4b0082, 0 0 35px #ffffff;
    }
    100% {
        color: #8b00ff;
        text-shadow: 0 0 10px #8b00ff, 0 0 25px #8b00ff, 0 0 35px #ffffff;
    }
}

/* CONTENITORI VIDEO */
.video-box {
    position: fixed;
    width: 240px;
    height: 520px;
    top: 50%;
    transform: translateY(-50%);
    border-radius: 14px;
    border: 3px solid #ff0000;
    overflow: hidden;
    z-index: 9999;
    background: transparent;
    animation: rainbowGlow 4s linear infinite;
}

/* POSIZIONE */
.video-left {
    left: 50px;
}

.video-right {
    right: 50px;
}

/* VIDEO */
.video-box video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* TESTO */
.video-text {
    position: absolute;
    bottom: 8px;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    pointer-events: none;
    animation: wave 3s ease-in-out infinite, rainbowText 4s linear infinite;
}

/* ANIMAZIONE ONDA */
@keyframes wave {
    0% {
        transform: translateY(0) rotate(0deg);
    }
    25% {
        transform: translateY(-4px) rotate(-1deg);
    }
    50% {
        transform: translateY(0) rotate(0deg);
    }
    75% {
        transform: translateY(4px) rotate(1deg);
    }
    100% {
        transform: translateY(0) rotate(0deg);
    }
}
</style>
</head>

<body>

<!-- VIDEO SINISTRO -->
<div class="video-box video-left">
    <video id="videoLeft" autoplay muted playsinline></video>
    <div class="video-text">GO-TO-MUSIC</div>
</div>

<!-- VIDEO DESTRO -->
<div class="video-box video-right">
    <video id="videoRight" autoplay muted playsinline></video>
    <div class="video-text">GO-TO-MUSIC</div>
</div>


<script>

/* =========================================================
   LISTA COMPLETA DEI VIDEO (CONTINUA E ALTERNATA NEL TEMPO)
   ========================================================= */

var videoSinistra = [
    "https://i.imgur.com/wLBSIh6.mp4",
    "https://i.imgur.com/lUFb3jd.mp4",
    "https://i.imgur.com/RN1bB3l.mp4",
    "https://i.imgur.com/hqSCuBc.mp4",
    "https://i.imgur.com/xAhgl0a.mp4",
    "https://i.imgur.com/Ajkrmaj.mp4"
];

var videoDestra = [
    "https://i.imgur.com/nmiDhAl.mp4",
    "https://i.imgur.com/mIGMNp7.mp4",
    "https://i.imgur.com/Hx5CHEO.mp4",
    "https://i.imgur.com/aKcAXIo.mp4",
    "https://i.imgur.com/6S6vLCt.mp4",
    "https://i.imgur.com/PWnhzNe.mp4"
];

var videoLeft = document.getElementById("videoLeft");
var videoRight = document.getElementById("videoRight");

/* 
  CALCOLO BASATO SUL TEMPO REALE (ORARIO ATTUALE):
  In questo modo il video in riproduzione dipende dall'ora e dal giorno correnti.
  Continuando a scorrere in base al tempo esatto, i video cambiano fluidamente 
  senza ricominciare mai daccapo bruscamente ad ogni apertura della pagina.
*/
function calcolaIndiceIniziale(lunghezzaLista) {
    var minutiTotali = Math.floor(Date.now() / (1000 * 60));
    var blocchiDi15Minuti = Math.floor(minutiTotali / 15);
    return blocchiDi15Minuti % lunghezzaLista;
}

var indiceSinistra = calcolaIndiceIniziale(videoSinistra.length);
/* Sfasiamo la destra per farli alternare con video diversi tra loro */
var indiceDestra = (indiceSinistra + 2) % videoDestra.length;


/* CARICA E RIPRODUCI SINISTRA */
function caricaVideoSinistra() {
    videoLeft.src = videoSinistra[indiceSinistra];
    videoLeft.load();
    var promessa = videoLeft.play();
    if (promessa !== undefined) {
        promessa.catch(function() {});
    }
}


/* CARICA E RIPRODUCI DESTRA */
function caricaVideoDestra() {
    videoRight.src = videoDestra[indiceDestra];
    videoRight.load();
    var promessa = videoRight.play();
    if (promessa !== undefined) {
        promessa.catch(function() {});
    }
}


/* AVVIO IMMEDIATO */
caricaVideoSinistra();
caricaVideoDestra();


/* LOOP CONTINUO DEL SINGOLO VIDEO SE DURA MENO DI 15 MINUTI */
videoLeft.onended = function() {
    videoLeft.play();
};

videoRight.onended = function() {
    videoRight.play();
};


/* =========================================================
   CAMBIO AUTOMATICO RIGOROSO OGNI 15 MINUTI (ININTERROTTO)
   ========================================================= */

setInterval(function() {
    indiceSinistra = (indiceSinistra + 1) % videoSinistra.length;
    caricaVideoSinistra();

    indiceDestra = (indiceDestra + 1) % videoDestra.length;
    caricaVideoDestra();

}, 15 * 60 * 1000);


/* =========================================================
   PROTEZIONE CONTRO COPIA / TASTO DESTRO
   ========================================================= */

var message = "no copy";

document.oncontextmenu = function() {
    alert(message);
    return false;
};

document.onmousedown = function(e) {
    if (e.button == 2 || e.button == 3) {
        alert(message);
        return false;
    }
};

document.onselectstart = function() {
    return false;
};

</script>

</body>
</html>
