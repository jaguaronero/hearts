<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Bolle di Sapone Realistiche</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background: transparent;
  }

  .bubble {
    position: absolute;
    bottom: -120px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%,
      rgba(255,255,255,0.8),
      rgba(255,255,255,0.2) 40%,
      rgba(0,0,0,0.05) 60%,
      transparent 70%);
    box-shadow:
      inset -10px -10px 20px rgba(255,255,255,0.2),
      inset 10px 10px 20px rgba(0,0,0,0.05),
      0 0 10px rgba(255,255,255,0.3);
    animation: rise linear infinite;
    backdrop-filter: blur(2px);
  }

  /* Effetto iridescente (arcobaleno) */
  .bubble::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(
      red, orange, yellow, green, cyan, blue, violet, red
    );
    opacity: 0.15;
    mix-blend-mode: overlay;
  }

  /* Riflesso principale */
  .bubble::before {
    content: "";
    position: absolute;
    top: 10%;
    left: 15%;
    width: 35%;
    height: 35%;
    background: radial-gradient(circle,
      rgba(255,255,255,0.9),
      rgba(255,255,255,0.2),
      transparent);
    border-radius: 50%;
    filter: blur(1px);
  }

  @keyframes rise {
    0% {
      transform: translateY(0) translateX(0) scale(1);
      opacity: 0.8;
    }
    50% {
      transform: translateY(-60vh) translateX(20px) scale(1.05);
    }
    100% {
      transform: translateY(-120vh) translateX(-20px) scale(1.1);
      opacity: 0;
    }
  }

  /* Stelle */
  .star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    box-shadow: 0 0 8px white;
    animation: twinkle 2s infinite alternate;
  }

  @keyframes twinkle {
    from { opacity: 0.2; transform: scale(1); }
    to { opacity: 1; transform: scale(1.8); }
  }
</style>
</head>
<body>

<script>
  // CREA 25 BOLLE REALISTICHE
  for (let i = 0; i < 25; i++) {
    const bubble = document.createElement("div");
    bubble.classList.add("bubble");

    const size = Math.random() * 80 + 30;

    bubble.style.width = size + "px";
    bubble.style.height = size + "px";
    bubble.style.left = Math.random() * 100 + "vw";
    bubble.style.animationDuration = (Math.random() * 12 + 6) + "s";
    bubble.style.animationDelay = Math.random() * 6 + "s";

    document.body.appendChild(bubble);
  }

  // STELLE
  for (let i = 0; i < 50; i++) {
    const star = document.createElement("div");
    star.classList.add("star");

    star.style.top = Math.random() * 100 + "vh";
    star.style.left = Math.random() * 100 + "vw";
    star.style.animationDuration = (Math.random() * 2 + 1) + "s";

    document.body.appendChild(star);
  }
</script>

</body>
</html>
