<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay Arcobaleno con Media Dinamici e Particelle</title>
    <style>
        /* SFONDO TRASPARENTE */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: transparent; /* Rende lo sfondo trasparente */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            box-sizing: border-box;
            padding: 30px 0;
        }

        /* CANVAS PER PARTICELLE RGB */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1; /* Rimane dietro a tutto */
            pointer-events: none;
        }

        /* ====================================================
           TESTO SCORREVOLE ARCOBALENO
        ==================================================== */
        .marquee-wrapper {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            z-index: 10;
        }

        .marquee-text {
            display: inline-block;
            font-size: 34px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(to right, #ff0000, #ff7f00, #ffff00, #00ff00, #00ffff, #0000ff, #8b00ff, #ff0000);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: scorrimentoASinistra 22s linear infinite, flussoColoriTesto 4s linear infinite;
        }

        @keyframes scorrimentoASinistra {
            0% { transform: translate3d(100vw, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        /* ====================================================
           RETTANGOLI (PORTALI)
        ==================================================== */
        .container {
            display: flex;
            justify-content: space-between;
            width: 100%;
            padding: 0 10%;
            box-sizing: border-box;
        }

        .rettangolo {
            width: 280px;
            height: 480px;
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(255, 0, 128, 0.2), 0 0 60px rgba(0, 255, 255, 0.1);
        }

        /* Bordo Arcobaleno Rotante */
        .rettangolo::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: conic-gradient(#ff0000, #ff7f00, #ffff00, #00ff00, #00ffff, #0000ff, #8b00ff, #ff0000);
            animation: ruotaArcobaleno 4s linear infinite;
            z-index: 1;
        }

        /* Sfondo interno protettivo prima del caricamento del media */
        .rettangolo::after {
            content: '';
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            background: rgba(10, 10, 25, 0.6); 
            border-radius: 12px;
            z-index: 2;
            backdrop-filter: blur(4px);
        }

        /* REGOLE PER IMMAGINI (GIF) E VIDEO DENTRO I RETTANGOLI */
        .rettangolo img, .rettangolo video {
            position: absolute;
            top: 4px;
            left: 4px;
            width: calc(100% - 8px);
            height: calc(100% - 8px);
            object-fit: cover; /* Taglia e adatta il contenuto senza deformarlo */
            border-radius: 12px;
            z-index: 3; /* Sopra la maschera scura, dentro il bordo */
        }

        @keyframes ruotaArcobaleno {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ====================================================
           SCRITTA "GO TO MUSIC"
        ==================================================== */
        .music-link-container {
            z-index: 10;
            margin-top: 10px;
        }

        .go-to-music {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-decoration: none;
            display: inline-block;
            background: linear-gradient(to right, #ff0000, #ff7f00, #ffff00, #00ff00, #00ffff, #0000ff, #8b00ff, #ff0000);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 8px rgba(0, 255, 255, 0.7)) drop-shadow(0 0 20px rgba(255, 0, 128, 0.5));
            animation: flussoColoriTesto 4s linear infinite, pulsazioneNeon 2s ease-in-out infinite alternate;
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .go-to-music:hover { transform: scale(1.1); }

        @keyframes flussoColoriTesto {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        @keyframes pulsazioneNeon {
            0% { filter: drop-shadow(0 0 6px rgba(0, 255, 255, 0.6)) drop-shadow(0 0 15px rgba(255, 0, 128, 0.4)); }
            100% { filter: drop-shadow(0 0 12px rgba(0, 255, 255, 0.9)) drop-shadow(0 0 30px rgba(255, 0, 128, 0.7)); }
        }

        /* Responsive per Smartphone */
        @media (max-width: 768px) {
            .marquee-text { font-size: 20px; }
            .rettangolo { width: 130px; height: 260px; }
            .go-to-music { font-size: 26px; letter-spacing: 2px; }
            .container { padding: 0 5%; }
            body { padding: 15px 0; }
        }
    </style>
</head>
<body>

    <!-- Canvas per le particelle RGB di sfondo -->
    <canvas id="particleCanvas"></canvas>

    <!-- Testo Scorrevole (Alto) -->
    <div class="marquee-wrapper">
        <span class="marquee-text" id="orologio-scorrevole">Caricamento...</span>
    </div>

    <!-- I due Rettangoli (Centro) -->
    <div class="container">
        <!-- Rettangolo SX: Oserà le GIF animate -->
        <div class="rettangolo" id="rettangolo-sx">
            <img id="gif-dinamica" src="" alt="GIF Fascia Oraria">
        </div>
        
        <!-- Rettangolo DX: Ospiterà i Video -->
        <div class="rettangolo" id="rettangolo-dx">
            <video id="video-dinamico" autoplay muted loop playsinline src=""></video>
        </div>
    </div>

    <!-- Scritta Go To Music (Basso) -->
    <div class="music-link-container">
        <a href="#" class="go-to-music">Go To Music</a>
    </div>

    <script>
        /* ====================================================
           1. SISTEMA PARTICELLE RGB NEON (CANVAS)
        ==================================================== */
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');

        let particles = [];
        const numParticles = 65; // Numero di particelle sullo schermo

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.speedX = (Math.random() - 0.5) * 0.8;
                this.speedY = (Math.random() - 0.5) * 0.8;
                this.hue = Math.random() * 360; // Colore iniziale casuale sulla ruota RGB
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.hue += 0.5; // Fa cambiare colore gradualmente alla particella

                // Rimbalzo sui bordi dello schermo
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }
            draw() {
                ctx.fillStyle = `hsla(${this.hue}, 100%, 60%, 0.7)`;
                ctx.shadowBlur = 10; // Effetto bagliore neon per la particella
                ctx.shadowColor = `hsl(${this.hue}, 100%, 60%)`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0; // Reset ombra per non appesantire le prestazioni
            }
        }

        function initParticles() {
            for (let i = 0; i < numParticles; i++) {
                particles.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }
        initParticles();
        animateParticles();


        /* ====================================================
           2. LOGICA FASCE ORARIE MEDIA (VIDEO & GIF)
        ==================================================== */
        function gestisciMediaEOrario() {
            const oraAttuale = new Date();
            const ore = oraAttuale.getHours();
            const minuti = String(oraAttuale.getMinutes()).padStart(2, '0');
            const secondi = String(oraAttuale.getSeconds()).padStart(2, '0');
            
            // --- GESTIONE SALUTO (Alto) ---
            let saluto = "Buona Sera";
            if (ore >= 5 && ore < 13) saluto = "Buon Giorno";
            else if (ore >= 13 && ore < 18) Gold = saluto = "Buon Pomeriggio";

            const opzioniData = { day: 'numeric', month: 'long', year: 'numeric' };
            let dataItaliano = oraAttuale.toLocaleDateString('it-IT', opzioniData);
            dataItaliano = dataItaliano.replace(/(\s[a-z])/g, (match) => match.toUpperCase());

            document.getElementById('orologio-scorrevole').innerText = 
                `${saluto}! — Sono le ore ${ore}:${minuti}:${secondi} — Oggi è il ${dataItaliano}`;


            // --- DX: 4 FASCE ORARIE PER 4 VIDEO ---
            const elementoVideo = document.getElementById('video-dinamico');
            let nuovoVideoSrc = "";

            if (ore >= 6 && ore < 12) {
                // Fascia 1: Mattina (06:00 - 11:59)
                nuovoVideoSrc = "https://jaguaronero.github.io/hearts/29.mp4"; 
            } else if (ore >= 12 && ore < 18) {
                // Fascia 2: Pomeriggio (12:00 - 17:59)
                nuovoVideoSrc = "https://jaguaronero.github.io/hearts/29.mp4";
            } else if (ore >= 18 && ore < 24) {
                // Fascia 3: Sera (18:00 - 23:59)
                nuovoVideoSrc = "https://jaguaronero.github.io/hearts/30.mp4";
            } else {
                // Fascia 4: Notte (00:00 - 05:59)
                nuovoVideoSrc = "https://jaguaronero.github.io/hearts/30.mp4";
            }

            // Cambia la sorgente video solo se è cambiata la fascia, per evitare continui riavvii
            if (!elementoVideo.src.includes(nuovoVideoSrc)) {
                elementoVideo.src = nuovoVideoSrc;
            }


            // --- SX: 3 FASCE ORARIE PER 3 GIF ---
            const elementoGif = document.getElementById('gif-dinamica');
            let nuovaGifSrc = "";

            if (ore >= 6 && ore < 14) {
                // Fascia 1: Mattina/Inizio Pomeriggio (06:00 - 13:59)
                nuovaGifSrc = "https://xatimg.com/image/TyDAZUZ4LpEe.gif";
            } else if (ore >= 14 && ore < 22) {
                // Fascia 2: Pomeriggio/Sera (14:00 - 21:59)
                nuovaGifSrc = "https://xatimg.com/image/HmhSLtYZh9fC.gif";
            } else {
                // Fascia 3: Notte/Tarda Sera (22:00 - 05:59)
                nuovaGifSrc = "https://xatimg.com/image/SZb3pwtVs3d7.gif";
            }

            if (!elementoGif.src.includes(nuovaGifSrc)) {
                elementoGif.src = nuovaGifSrc;
            }
        }

        // Avvio immediato e controllo costante ogni secondo
        gestisciMediaEOrario();
        setInterval(gestisciMediaEOrario, 1000);
    </script>
</body>
</html>
