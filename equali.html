<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equalizzatori Go To Music & Mille Ricordi con Orologio Arcobaleno</title>
    <style>
        /* Reset e sfondo completamente trasparente per Xatframe */
        html, body {
            margin: 0;
            padding: 0;
            background: transparent !important;
            min-height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            box-sizing: border-box;
            overflow-x: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 15px 10px;
            position: relative;
        }

        /* Container Pulsanti Radio in alto a sx */
        .top-controls-container {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            gap: 10px;
            z-index: 50;
        }

        /* Stile Pulsanti Radio Sci-Fi con testo #8F0808 */
        .top-radio-btn {
            background: rgba(0, 242, 254, 0.15);
            border: 1px solid rgba(0, 242, 254, 0.5);
            color: #8F0808;
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
            outline: none;
            user-select: none;
        }

        .top-radio-btn:hover {
            background: rgba(0, 242, 254, 0.3);
            border-color: rgba(0, 242, 254, 0.9);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.6);
            transform: scale(1.05);
        }

        .top-radio-btn.playing {
            background: rgba(0, 255, 128, 0.25);
            border-color: rgba(0, 255, 128, 0.8);
            box-shadow: 0 0 20px rgba(0, 255, 128, 0.6);
        }

        .top-radio-btn.loading {
            border-color: rgba(255, 204, 0, 0.8);
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.6);
        }

        /* Container dell'Orologio e Data Sci-Fi - COMPLETAMENTE TRASPARENTE */
        .scifi-clock-panel {
            position: relative;
            background: transparent !important;
            border: none;
            padding: 10px 20px;
            margin-top: 25px;
            margin-bottom: 20px;
            text-align: center;
            user-select: none;
            z-index: 20;
            animation: clockPulse 3s ease-in-out infinite alternate;
        }

        /* Data in formato italiano con effetto ARCOBALENO ANIMATO INFINITO */
        .scifi-date {
            font-size: 18px;
            font-weight: 800;
            text-transform: capitalize;
            letter-spacing: 2px;
            margin-bottom: 6px;
            background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #00ffff, #0000ff, #8b00ff, #ff0000);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbowText 6s linear infinite, rainbowGlow 6s linear infinite;
        }

        /* Orologio Digitale HH:MM:SS con effetto ARCOBALENO ANIMATO INFINITO */
        .scifi-time {
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 4px;
            font-family: 'Courier New', Courier, monospace;
            background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #00ffff, #0000ff, #8b00ff, #ff0000);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbowText 4s linear infinite, rainbowGlow 4s linear infinite;
        }

        /* Container principale degli Equalizzatori */
        .eq-wrapper-container {
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            width: 100%;
            max-width: 900px;
            flex-wrap: wrap;
            gap: 20px;
        }

        /* Container singolo equalizzatore 380x380 */
        .eq-container {
            width: 380px;
            height: 380px;
            background: transparent;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Wrapper centrale dell'equalizzatore */
        .scifi-eq-wrapper {
            position: relative;
            width: 340px;
            height: 340px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Anello esterno con arcobaleno animato infinito e rotazione oraria */
        .tech-ring-outer {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2.5px dashed;
            border-radius: 50%;
            animation: spinClockwise 25s linear infinite, rainbowColor 8s linear infinite;
        }

        /* Anello medio con arcobaleno animato infinito e rotazione antioraria */
        .tech-ring-inner {
            position: absolute;
            width: 260px;
            height: 260px;
            border: 2.5px dotted;
            border-radius: 50%;
            animation: spinCounter 18s linear infinite, rainbowColor 8s linear infinite reverse;
        }

        /* Nucleo centrale olografico (visivo) */
        .holo-core {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.35) 0%, rgba(255, 0, 128, 0.25) 70%, transparent 100%);
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.5), inset 0 0 20px rgba(255, 0, 128, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(0, 242, 254, 0.8);
            animation: pulseCore 2.5s ease-in-out infinite alternate;
            z-index: 10;
            user-select: none;
            padding: 10px;
            box-sizing: border-box;
        }

        .holo-core.playing {
            background: radial-gradient(circle, rgba(0, 255, 128, 0.45) 0%, rgba(0, 242, 254, 0.3) 70%, transparent 100%);
            box-shadow: 0 0 45px rgba(0, 255, 128, 0.7), inset 0 0 25px rgba(0, 242, 254, 0.8);
            border-color: rgba(0, 255, 128, 0.6);
            animation: pulsePlaying 1s ease-in-out infinite alternate;
        }

        .btn-title {
            font-size: 11px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            text-align: center;
            line-height: 1.2;
            word-break: break-word;
        }

        .btn-status {
            font-size: 20px;
            margin-top: 4px;
        }

        /* Singolo nodo/barra dello spettro circolare */
        .spectrum-node {
            position: absolute;
            bottom: 50%;
            left: 50%;
            width: 4px;
            height: 100px;
            transform-origin: bottom center;
            border-radius: 4px;
            animation: scifiWave 1.6s ease-in-out infinite alternate;
            box-shadow: 0 0 10px currentColor;
        }

        /* ANIMAZIONI ARCOBALENO E NEON */
        @keyframes rainbowText {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes rainbowGlow {
            0% { filter: drop-shadow(0 0 10px rgba(255, 0, 0, 0.8)); }
            16% { filter: drop-shadow(0 0 10px rgba(255, 255, 0, 0.8)); }
            33% { filter: drop-shadow(0 0 10px rgba(0, 255, 0, 0.8)); }
            50% { filter: drop-shadow(0 0 10px rgba(0, 255, 255, 0.8)); }
            66% { filter: drop-shadow(0 0 10px rgba(0, 0, 255, 0.8)); }
            83% { filter: drop-shadow(0 0 10px rgba(255, 0, 255, 0.8)); }
            100% { filter: drop-shadow(0 0 10px rgba(255, 0, 0, 0.8)); }
        }

        @keyframes spinClockwise {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes spinCounter {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-360deg); }
        }

        @keyframes rainbowColor {
            0% { border-color: hsl(0, 100%, 55%); box-shadow: 0 0 20px hsl(0, 100%, 55%), inset 0 0 15px hsl(0, 100%, 55%); }
            16% { border-color: hsl(60, 100%, 55%); box-shadow: 0 0 20px hsl(60, 100%, 55%), inset 0 0 15px hsl(60, 100%, 55%); }
            33% { border-color: hsl(120, 100%, 55%); box-shadow: 0 0 20px hsl(120, 100%, 55%), inset 0 0 15px hsl(120, 100%, 55%); }
            50% { border-color: hsl(180, 100%, 55%); box-shadow: 0 0 20px hsl(180, 100%, 55%), inset 0 0 15px hsl(180, 100%, 55%); }
            66% { border-color: hsl(240, 100%, 55%); box-shadow: 0 0 20px hsl(240, 100%, 55%), inset 0 0 15px hsl(240, 100%, 55%); }
            83% { border-color: hsl(300, 100%, 55%); box-shadow: 0 0 20px hsl(300, 100%, 55%), inset 0 0 15px hsl(300, 100%, 55%); }
            100% { border-color: hsl(360, 100%, 55%); box-shadow: 0 0 20px hsl(360, 100%, 55%), inset 0 0 15px hsl(360, 100%, 55%); }
        }

        @keyframes clockPulse {
            0% { transform: scale(0.98); }
            100% { transform: scale(1.02); }
        }

        @keyframes pulseCore {
            0% { transform: scale(0.9); opacity: 0.7; }
            100% { transform: scale(1.05); opacity: 1; }
        }

        @keyframes pulsePlaying {
            0% { transform: scale(0.95); opacity: 0.8; }
            100% { transform: scale(1.12); opacity: 1; }
        }

        @keyframes scifiWave {
            0% {
                transform: translate(-50%, 0) rotate(var(--angle)) scaleY(0.25);
                filter: brightness(0.5);
            }
            50% {
                transform: translate(-50%, 0) rotate(var(--angle)) scaleY(1.3);
                filter: brightness(1.5);
            }
            100% {
                transform: translate(-50%, 0) rotate(var(--angle)) scaleY(0.5);
                filter: brightness(0.9);
            }
        }
    </style>
</head>
<body>

    <!-- Pulsanti Radio in alto a sinistra -->
    <div class="top-controls-container">
        <button class="top-radio-btn" id="topBtn-left" type="button">
            <span>Go To Music</span>
            <span id="topStatus-left">▶</span>
        </button>
        <button class="top-radio-btn" id="topBtn-right" type="button">
            <span>Mille Ricordi</span>
            <span id="topStatus-right">▶</span>
        </button>
    </div>

    <!-- Pannello Orologio e Data Sci-Fi COMPLETAMENTE TRASPARENTE -->
    <div class="scifi-clock-panel">
        <div class="scifi-date" id="scifiDate">Caricamento data...</div>
        <div class="scifi-time" id="scifiTime">00:00:00</div>
    </div>

    <!-- Wrapper per entrambi gli Equalizzatori -->
    <div class="eq-wrapper-container">
        <!-- Container Sinistro (Go To Music Visualizer) -->
        <div class="eq-container" id="eq-left"></div>

        <!-- Container Destro (Mille Ricordi Visualizer) -->
        <div class="eq-container" id="eq-right"></div>
    </div>

    <!-- Elementi Audio Separati per SX e DX -->
    <audio id="audioLeft" crossorigin="anonymous" preload="none">
        <source src="https://sp4.server89.com:7027/stream" type="audio/mpeg">
    </audio>

    <audio id="audioRight" crossorigin="anonymous" preload="none">
        <source src="https://node-14.zeno.fm/xh0txuqr0v8uv?zs=KULRBS6sQcGK70KY33r7IQ&rj-tok=AAABgDktPVMA09m2cc37_h6yBA&rj-ttl=5" type="audio/mpeg">
    </audio>

    <script>
        // Gestione Orologio e Data in formato Italiano
        function updateClockAndDate() {
            const now = new Date();
            const dateOptions = { 
                weekday: 'long', 
                day: 'numeric', 
                month: 'long', 
                year: 'numeric' 
            };
            
            let formattedDate = now.toLocaleDateString('it-IT', dateOptions);
            formattedDate = formattedDate.charAt(0).toUpperCase() + formattedDate.slice(1);

            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const formattedTime = `${hours}:${minutes}:${seconds}`;

            document.getElementById('scifiDate').textContent = formattedDate;
            document.getElementById('scifiTime').textContent = formattedTime;
        }

        setInterval(updateClockAndDate, 1000);
        updateClockAndDate();

        // Configurazione delle Stazioni Radio
        const STATIONS = {
            left: {
                containerId: 'eq-left',
                audioElement: document.getElementById('audioLeft'),
                title: 'Go To Music',
                url: 'https://sp4.server89.com:7027/stream',
                isAttemptingPlay: false
            },
            right: {
                containerId: 'eq-right',
                audioElement: document.getElementById('audioRight'),
                title: 'Mille Ricordi',
                url: 'https://node-14.zeno.fm/xh0txuqr0v8uv?zs=KULRBS6sQcGK70KY33r7IQ&rj-tok=AAABgDktPVMA09m2cc37_h6yBA&rj-ttl=5',
                isAttemptingPlay: false
            }
        };

        // Funzione per creare la struttura grafica dell'equalizzatore
        function createSciFiEqualizer(stationKey) {
            const config = STATIONS[stationKey];
            const container = document.getElementById(config.containerId);
            if (!container) return;

            const wrapper = document.createElement('div');
            wrapper.className = 'scifi-eq-wrapper';

            const outerRing = document.createElement('div');
            outerRing.className = 'tech-ring-outer';
            const innerRing = document.createElement('div');
            innerRing.className = 'tech-ring-inner';

            // Nucleo centrale visivo
            const coreDiv = document.createElement('div');
            coreDiv.className = 'holo-core';
            coreDiv.setAttribute('id', `core-${stationKey}`);
            coreDiv.innerHTML = `
                <span class="btn-title">${config.title}</span>
                <span class="btn-status" id="core-status-${stationKey}">▶</span>
            `;

            wrapper.appendChild(outerRing);
            wrapper.appendChild(innerRing);
            wrapper.appendChild(coreDiv);

            // Generazione delle 36 barre dello spettro
            const nodeCount = 36;
            for (let i = 0; i < nodeCount; i++) {
                const node = document.createElement('div');
                node.className = 'spectrum-node';

                const angle = (i * 360) / nodeCount;
                const hue = (i * (360 / nodeCount)) % 360;

                node.style.setProperty('--angle', `${angle}deg`);
                node.style.background = `linear-gradient(to top, hsl(${hue}, 100%, 50%), hsl(${(hue + 90) % 360}, 100%, 70%))`;
                node.style.color = `hsl(${hue}, 100%, 60%)`;
                node.style.animationDelay = `${(i * 0.05) % 1.6}s`;

                wrapper.appendChild(node);
            }

            container.appendChild(wrapper);
            setupAudioEvents(stationKey);
        }

        // Gestione Riproduzione Indipendente legata ai bottoni in alto
        function toggleAudio(activeKey) {
            const activeStation = STATIONS[activeKey];
            const otherKey = activeKey === 'left' ? 'right' : 'left';

            // Ferma l'altra stazione se in riproduzione
            stopAudio(otherKey);

            if (activeStation.audioElement.paused) {
                if (activeStation.isAttemptingPlay) return;

                activeStation.isAttemptingPlay = true;
                updateButtonState(activeKey, 'loading');

                activeStation.audioElement.src = activeStation.url + (activeStation.url.includes('?') ? '&' : '?') + 't=' + Date.now();
                activeStation.audioElement.load();

                const playPromise = activeStation.audioElement.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        activeStation.isAttemptingPlay = false;
                        updateButtonState(activeKey, 'playing');
                    }).catch(err => {
                        console.warn(`Riproduzione interrotta [${activeKey}]:`, err);
                        activeStation.isAttemptingPlay = false;
                        updateButtonState(activeKey, 'paused');
                    });
                }
            } else {
                stopAudio(activeKey);
            }
        }

        // Interruzione Audio
        function stopAudio(key) {
            const station = STATIONS[key];
            if (!station.audioElement.paused || station.isAttemptingPlay) {
                station.audioElement.pause();
                station.audioElement.src = '';
                station.audioElement.load();
                station.isAttemptingPlay = false;
                updateButtonState(key, 'paused');
            }
        }

        // Aggiornamento dello Stato Visivo (Pulsanti in alto + Nuclei Equalizzatore)
        function updateButtonState(key, state) {
            const topBtn = document.getElementById(`topBtn-${key}`);
            const topStatus = document.getElementById(`topStatus-${key}`);
            const coreDiv = document.getElementById(`core-${key}`);
            const coreStatus = document.getElementById(`core-status-${key}`);

            if (topBtn) topBtn.classList.remove('playing', 'loading');
            if (coreDiv) coreDiv.classList.remove('playing');

            if (state === 'playing') {
                if (topBtn) topBtn.classList.add('playing');
                if (topStatus) topStatus.textContent = '⏸';
                if (coreDiv) coreDiv.classList.add('playing');
                if (coreStatus) coreStatus.textContent = '⏸';
            } else if (state === 'loading') {
                if (topBtn) topBtn.classList.add('loading');
                if (topStatus) topStatus.textContent = '⌛';
                if (coreStatus) coreStatus.textContent = '⌛';
            } else {
                if (topStatus) topStatus.textContent = '▶';
                if (coreStatus) coreStatus.textContent = '▶';
            }
        }

        // Configurazione degli eventi audio nativi
        function setupAudioEvents(key) {
            const station = STATIONS[key];
            
            station.audioElement.addEventListener('playing', () => updateButtonState(key, 'playing'));
            station.audioElement.addEventListener('pause', () => updateButtonState(key, 'paused'));
            station.audioElement.addEventListener('error', () => {
                console.error(`Errore audio nello stream [${key}].`);
                station.isAttemptingPlay = false;
                updateButtonState(key, 'paused');
            });
        }

        // Inizializzazione al caricamento
        window.addEventListener('DOMContentLoaded', () => {
            createSciFiEqualizer('left');
            createSciFiEqualizer('right');

            // Event Listeners per i pulsanti in alto a sinistra
            const btnLeft = document.getElementById('topBtn-left');
            const btnRight = document.getElementById('topBtn-right');

            const handleLeftToggle = (e) => { e.preventDefault(); toggleAudio('left'); };
            const handleRightToggle = (e) => { e.preventDefault(); toggleAudio('right'); };

            btnLeft.addEventListener('click', handleLeftToggle);
            btnLeft.addEventListener('touchstart', handleLeftToggle, { passive: false });

            btnRight.addEventListener('click', handleRightToggle);
            btnRight.addEventListener('touchstart', handleRightToggle, { passive: false });
        });
    </script>

</body>
</html>
