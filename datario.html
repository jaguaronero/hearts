<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>FERNY-JAGUARO</title>
  <style>
    body { margin: 0; background: transparent; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: Arial, sans-serif; }
    .container { position: relative; display: flex; justify-content: space-between; align-items: center; width: 100%; height: 100vh; padding: 0 50px; margin-top: 50px; box-sizing: border-box; }
    
    .colonna-sx { display: flex; flex-direction: column; justify-content: center; transform: translateY(40px); }
    .colonna-dx { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; transform: translateY(40px); }
    
    .wrapper { position: relative; overflow: hidden; border-radius: 22px; width: 270px; height: 484px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }

    @keyframes rainbow-bg { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
    @keyframes pulsante { 0% { transform: scale(1); opacity: 0.7; } 50% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(1); opacity: 0.7; } }
    .pulsing { animation: pulsante 2s ease-in-out infinite; }

    .wrapper::after { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; box-sizing: border-box; border: 9px solid transparent; border-radius: 22px; background: linear-gradient(90deg, #ff0000, #ffaa00, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000) border-box; -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0); -webkit-mask-composite: destination-out; mask-composite: exclude; background-size: 200%; animation: rainbow-bg 3s linear infinite; z-index: 10; pointer-events: none; }
    
    .testo-arcobaleno { background: linear-gradient(90deg, #ff0000, #ffaa00, #ffff00, #00ffaa, #00aaff, #aa00ff, #ff0000); background-size: 200%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: rainbow-bg 3s linear infinite; }
    .left { background-color: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
    .right { background: transparent; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
    
    .saluto-testo { font-family: 'Arial Black', sans-serif; font-size: 20px; font-weight: 900; margin-bottom: 5px; text-transform: uppercase; }
    .datario-container { color: #fff; font-size: 16px; margin-bottom: 5px; font-weight: bold; text-transform: uppercase; }
    .orario-grande { font-family: 'Arial Black', sans-serif; font-size: 50px; font-weight: 900; margin-bottom: 5px; }
    
    .testo-dinamico-video { margin-bottom: 25px; font-family: 'Arial Black', sans-serif; font-size: 16px; color: #fff; text-transform: uppercase; letter-spacing: 2px; z-index: 5; background: rgba(0, 0, 0, 0.5); padding: 10px 20px; border-radius: 15px; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); box-shadow: 0 0 15px rgba(0,0,0,0.5); }
    .side-video { width: 100%; height: 100%; object-fit: cover; opacity: 1; border-radius: 22px; z-index: 1; position: absolute; top: 0; left: 0; }
    
    .btn-ascolta { position: absolute; top: -85px; background: rgba(0, 0, 0, 0.9); border: 2px solid #00ffff; border-radius: 8px; padding: 6px 14px; color: white; font-family: 'Arial Black', sans-serif; font-size: 12px; cursor: pointer; text-transform: uppercase; box-shadow: 0 0 10px rgba(0, 255, 255, 0.4); transition: all 0.3s ease; z-index: 9999; }
    .btn-ascolta:hover { background: rgba(0, 255, 255, 0.2); transform: scale(1.05); }
    
    #sblocco-audio-click { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 99998; background: transparent; cursor: pointer; }
  </style>
</head>
<body>
<div id="sblocco-audio-click"></div>
<div class="container">
  <div class="colonna-sx">
    <div class="wrapper left">
      <div id="saluto-fisso" class="saluto-testo testo-arcobaleno">...</div>
      <div id="datario" class="datario-container">--/--/----</div>
      <div id="orario-grande" class="orario-grande testo-arcobaleno">00:00</div>
      <div class="data-info" style="color:#fff">
        <div id="citta-visitatore" style="color:#00ffff; font-weight:bold; text-transform: uppercase; margin-top: 5px;">CITTÀ REALE: IN RICERCA...</div>
      </div>
    </div>
  </div>
  <div class="colonna-dx">
    <button id="tasto-audio" class="btn-ascolta">OFF AUDIO</button>
    <div class="wrapper right">
      <video id="video-ragazze" class="side-video" autoplay loop playsinline muted>
        <source id="video-source" src="" type="video/mp4">
      </video>
      <div id="testo-sotto-video" class="testo-dinamico-video pulsing">...</div>
    </div>
  </div>
</div>

<script>
  const videoRagazze = document.getElementById('video-ragazze');
  const videoSource = document.getElementById('video-source');
  const testoSottoVideo = document.getElementById('testo-sotto-video');
  const tastoAudio = document.getElementById('tasto-audio');
  const veloSblocco = document.getElementById('sblocco-audio-click');
  let lastSaluto = "";
  let mutedTimeout = null;

  // 1. GESTIONE GEOLOCALIZZAZIONE DINAMICA TRAMITE IP (Più veloce e senza fastidiosi permessi)
  function ottieniCittaGeolocal() {
    const cittaElement = document.getElementById('citta-visitatore');
    
    // Usiamo geojs.io che rileva la città automaticamente dalla connessione internet
    fetch('https://get.geojs.io/v1/ip/geo.json')
      .then(response => response.json())
      .then(data => {
        // Se trova la città la mostra, altrimenti scrive "NON RILEVATA"
        const city = data.city || "NON RILEVATA";
        cittaElement.innerText = "CITTÀ REALE: " + city.toUpperCase();
      })
      .catch(() => { 
        cittaElement.innerText = "CITTÀ REALE: NON RILEVATA"; 
      });
  }

  ottieniCittaGeolocal();

  // Interazione iniziale necessaria per sbloccare l'audio nei browser
  function sbloccaAudioGenerale() {
    videoRagazze.muted = false;
    tastoAudio.innerText = "OFF AUDIO";
    gestisciSiglaUndiciSecondi();
    if(veloSblocco) veloSblocco.remove();
  }
  veloSblocco.addEventListener('click', sbloccaAudioGenerale);
  
  tastoAudio.addEventListener('click', () => {
    videoRagazze.muted = !videoRagazze.muted;
    tastoAudio.innerText = videoRagazze.muted ? "ON AUDIO" : "OFF AUDIO";
    if (mutedTimeout) clearTimeout(mutedTimeout);
  });

  // Funzione che forza l'audio attivo per 11 secondi sulla sigla oraria
  function gestisciSiglaUndiciSecondi() {
    if (mutedTimeout) clearTimeout(mutedTimeout);
    
    videoRagazze.muted = false;
    tastoAudio.innerText = "OFF AUDIO";

    // Dopo esattamente 11 secondi rimette in MUTED
    mutedTimeout = setTimeout(() => {
      videoRagazze.muted = true;
      tastoAudio.innerText = "ON AUDIO";
    }, 11000); 
  }

  // 2. CONTROLLO ORARIO E CAMBIO FASCE (11 SECONDI DI SIGLA AD OGNI CAMBIO)
  function updateData() {
    const now = new Date();
    
    const optionsDate = { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' };
    document.getElementById('datario').innerText = now.toLocaleDateString('it-IT', optionsDate);
    document.getElementById('orario-grande').innerText = now.toLocaleTimeString('it-IT', {hour: '2-digit', minute:'2-digit'});
        
    const hour = now.getHours();
    let saluto = "", videoUrl = "";
    
    // Configurazione Mattino / Pomeriggio / Sera / Notte
    if (hour >= 6 && hour < 12) { 
      saluto = "BUONGIORNO"; 
      videoUrl = "https://i.imgur.com/dRXFuYY.mp4"; 
    } else if (hour >= 12 && hour < 18) { 
      saluto = "BUON POMERIGGIO"; 
      videoUrl = "https://i.imgur.com/s0tGoNn.mp4"; 
    } else if (hour >= 18 && hour < 24) { 
      saluto = "BUONASERA"; 
      videoUrl = "https://i.imgur.com/c4FPKDZ.mp4"; 
    } else { 
      saluto = "BUON ASCOLTO"; 
      videoUrl = "https://i.imgur.com/SXKPrwy.mp4"; 
    }

    if (saluto !== lastSaluto) {
      document.getElementById('saluto-fisso').innerText = saluto;
      testoSottoVideo.innerText = saluto + "!";
      lastSaluto = saluto;
      videoSource.src = videoUrl;
      videoRagazze.load();
      
      // Se lo schermo trasparente iniziale è già stato rimosso, attiva gli 11 secondi di sigla
      if (!document.getElementById('sblocco-audio-click')) {
        gestisciSiglaUndiciSecondi();
      }
    }
  }

  updateData();
  setInterval(updateData, 1000);
</script>
</body>
</html>
