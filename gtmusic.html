<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>gtmusic:</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://i.imgur.com/YTsSEle.png" sizes="48x48">
    <style type="text/css">
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { height: 100vh; width: 100vw; overflow: hidden; display: flex; justify-content: center; align-items: flex-start; padding-top: 60px; background: #000 url('https://xatimg.com/image/fwV3tDxnbhSa.png') center/cover no-repeat; font-family: 'Segoe UI', Roboto, sans-serif; }
        .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, rgba(0, 255, 0, 0.3) 0%, rgba(255, 255, 0, 0.2) 100%); z-index: 1; pointer-events: none; transition: 1.5s ease-in-out; }
        .main-scaler { transform: scale(min(1, calc(100vw / 1700), calc(100vh / 950))); transform-origin: top center; display: flex; justify-content: center; align-items: center; z-index: 10; width: 1700px; }
        .stage-area { position: relative; width: 728px; height: 486px; margin-top: 39px; }
        .theme-nav { position: absolute; top: -35px; left: 0; width: 100%; display: flex; justify-content: space-between; z-index: 9999; padding: 0 5px; }
        .theme-nav span { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; background: radial-gradient(circle at 35% 35%, #fff 0%, var(--c1) 40%, var(--c2) 100%); border: 1px solid rgba(255,255,255,0.5); box-shadow: 0 5px 15px rgba(0,0,0,0.8), inset 0 -2px 5px rgba(0,0,0,0.5); transition: 0.3s; flex-shrink: 0; }
        .dj-wrap { position: absolute; top: 45px; width: 160px; height: 340px; display: flex; align-items: center; justify-content: center; z-index: 20; padding-top: 90px; }
        .left-dj { left: -210px; } .right-dj { right: -220px; }
        .dj-wrap img { width: 280px; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.8)); transform: scaleY(1.15); animation: floatAnim 4s ease-in-out infinite; }
        .left-dj img { margin-left: -40px; }
        @keyframes floatAnim { 0%, 100% { transform: scaleY(1.15) translateY(0); } 50% { transform: scaleY(1.15) translateY(-10px); } }
        .v-label { position: absolute; font-size: 3rem; white-space: nowrap; z-index: 30; text-transform: uppercase; font-weight: 900; letter-spacing: -2px; margin-top: -90px; }
        .left-dj .v-label { transform: rotate(-90deg); left: -280px; } .right-dj .v-label { transform: rotate(90deg); right: -280px; }
        .rainbow { background: linear-gradient(to right, #FF0000, #FF00FF, #0000FF, #00FFFF, #00FF00, #FFFF00, #FF0000); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: rainbow-anim 4s linear infinite; }
        @keyframes rainbow-anim { to { background-position: 200% center; } }
        .footer-text { position: absolute; bottom: -90px; width: 1200px; left: 50%; transform: translateX(-50%); text-align: center; font-size: 2.3rem; font-weight: 900; text-shadow: 0 8px 30px rgba(0,0,0,1); }
    </style>
</head>
<body oncontextmenu="return false;" onselectstart="return false;">

    <div class="bg-overlay" id="overlay"></div>

    <div class="main-scaler">
        <div class="stage-area">
            <div class="theme-nav">
                <span style="--c1:#00ff00; --c2:#004400;" onclick="applyTheme('rgba(0,255,0,0.3)','rgba(0,50,0,0.7)')"></span> 
                <span style="--c1:#0000ff; --c2:#000033;" onclick="applyTheme('rgba(0,0,255,0.3)','rgba(0,0,50,0.7)')"></span> 
                <span style="--c1:#ff0000; --c2:#440000;" onclick="applyTheme('rgba(255,0,0,0.3)','rgba(50,0,0,0.7)')"></span> 
                <span style="--c1:#00ffff; --c2:#004444;" onclick="applyTheme('rgba(0,255,255,0.3)','rgba(0,50,50,0.7)')"></span> 
                <span style="--c1:#ff00ff; --c2:#440044;" onclick="applyTheme('rgba(255,0,255,0.3)','rgba(50,0,50,0.7)')"></span> 
                <span style="--c1:#ffff00; --c2:#444400;" onclick="applyTheme('rgba(255,255,0,0.3)','rgba(50,50,0,0.7)')"></span>
                <span style="--c1:#ffffff; --c2:#333333;" onclick="applyTheme('rgba(255,255,255,0.3)','rgba(50,50,50,0.4)')"></span>
                <span style="--c1:#ff8800; --c2:#442200;" onclick="applyTheme('rgba(255,136,0,0.3)','rgba(100,50,0,0.7)')"></span>
                <span style="--c1:#8800ff; --c2:#220044;" onclick="applyTheme('rgba(136,0,255,0.3)','rgba(50,0,100,0.7)')"></span>
                <span style="--c1:#00ff88; --c2:#004422;" onclick="applyTheme('rgba(0,255,136,0.3)','rgba(0,100,50,0.7)')"></span>
                <span style="--c1:#4b0082; --c2:#1a0033;" onclick="applyTheme('rgba(75,0,130,0.3)','rgba(0,0,0,0.8)')"></span>
                <span style="--c1:#adff2f; --c2:#223300;" onclick="applyTheme('rgba(173,255,47,0.3)','rgba(50,70,0,0.7)')"></span>
                <span style="--c1:#ffa07a; --c2:#441111;" onclick="applyTheme('rgba(255,160,122,0.3)','rgba(80,30,30,0.7)')"></span>
                <span style="--c1:#7fffd4; --c2:#003322;" onclick="applyTheme('rgba(127,255,212,0.3)','rgba(30,80,60,0.7)')"></span>
                <span style="--c1:#ffd700; --c2:#332200;" onclick="applyTheme('rgba(255,215,0,0.3)','rgba(0,0,0,0.8)')"></span>
            </div>

            <div class="dj-wrap left-dj">
                <div class="v-label rainbow">Go To Music</div>
                <img id="left-gif" src="" alt="DJ Left">
            </div>

            <div class="dj-wrap right-dj">
                <div class="v-label rainbow">Go To Music</div>
                <img id="right-gif" src="" alt="DJ Right">
            </div>

            <div class="footer-text rainbow">Go To Music É Qui...</div>
        </div>
    </div>

    <script>
        function applyTheme(topColor, bottomColor) {
            document.getElementById('overlay').style.background = `linear-gradient(to bottom, ${topColor} 0%, ${bottomColor} 100%)`;
        }

        function updateGifs() {
            const gifPairs = [
               ["https://xatimg.com/image/HmhSLtYZh9fC.gif", "https://xatimg.com/image/TyDAZUZ4LpEe.gif"],
                ["https://xatimg.com/image/013NqaXRURA4.gif", "https://i.imgur.com/f9sA7bM.gif"],
                ["https://i.imgur.com/up0UXnp.gif", "https://i.imgur.com/kiBILKF.gif"],
                ["https://i.imgur.com/ltDeVS4.gif", "https://i.imgur.com/fglxwZ7.gif"],
                ["https://i.imgur.com/rLxn6T0.gif", "https://i.imgur.com/rU5527P.gif"],
                ["https://i.imgur.com/9qw0PUs.gif", "https://i.imgur.com/cFUW8h1.gif"],
                ["https://i.imgur.com/NfUYNqC.gif", "https://i.imgur.com/4Y0Xj3n.gif"],
                ["https://i.imgur.com/TBdmU99.gif", "https://i.imgur.com/vfO0KJd.gif"]
            ];

            // Calcola il blocco di 30 minuti basato sull'orario attuale del browser
            const now = new Date();
            const totalHalfHours = (now.getHours() * 2) + (now.getMinutes() >= 30 ? 1 : 0);
            const index = totalHalfHours % gifPairs.length;

            document.getElementById('left-gif').src = gifPairs[index][0];
            document.getElementById('right-gif').src = gifPairs[index][1];
        }

        // Aggiorna subito al caricamento
        updateGifs();
        // Controlla e aggiorna ogni 30 minuti (1.800.000 ms)
        setInterval(updateGifs, 1800000); 

        document.oncontextmenu = function(){ alert("©arlos Copyright"); return false; };
    </script>
</body>
</html>
