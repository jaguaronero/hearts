<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auguri Ferny! Effect</title>
    <style>
        /* Reset base e sfondo scuro per far risaltare i colori */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: ; /* Blu notte molto scuro */
            font-family: 'Arial', sans-serif;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Testo centrale fisso opzionale per dare enfasi */
        .centro-auguri {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            font-size: 3rem;
            font-weight: bold;
            text-shadow: 0 0 20px #ff007f, 0 0 40px #00f0ff;
            z-index: 2;
            text-align: center;
            pointer-events: none;
            user-select: none;
        }
    </style>
</head>
<body>

    <div class="centro-auguri">Buon Onomastico Ferny! 🎉</div>
    <canvas id="canvasEffetto"></canvas>

    <script>
        const canvas = document.getElementById('canvasEffetto');
        const ctx = canvas.getContext('2d');

        // Ridimensiona il canvas a tutto schermo
        function ridimensiona() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        ridimensiona();
        window.addEventListener('resize', ridimensiona);

        // Array di colori brillanti (sistemato!)
        const colori = [
            '#FF007F', '#FF0000', '#FF7F00', '#FFFF00', 
            '#00FF00', '#00FFFF', '#007FFF', '#7F00FF', 
            '#FF00FF', '#FFD700', '#00FFCC'
        ];

        // Configurazione delle scritte cadenti
        const numeroScritte = 40; 
        const scritteArray = [];

        class ScrittaCadente {
            constructor() {
                this.inizializza(true);
            }

            inizializza(allInizio = false) {
                this.testo = "Auguri Ferny";
                this.x = Math.random() * canvas.width;
                // Distribuisce le scritte all'inizio, poi le fa nascere sopra il bordo superiore
                this.y = allInizio ? (Math.random() * canvas.height) : (Math.random() * -100 - 20);
                this.size = Math.floor(Math.random() * 16) + 16; // Dimensione tra 16px e 32px
                this.speedY = (Math.random() * 1.5) + 1; // Velocità di caduta
                this.speedX = (Math.random() * 0.6) - 0.3; // Leggero ondeggiamento laterale
                this.colore = colori[Math.floor(Math.random() * colori.length)];
                this.opacita = (Math.random() * 0.4) + 0.6; 
            }

            aggiorna() {
                this.y += this.speedY;
                this.x += this.speedX;

                // Se esce dal fondo, si rigenera in alto
                if (this.y > canvas.height + 30) {
                    this.inizializza(false);
                }
            }

            disegna() {
                ctx.save();
                ctx.globalAlpha = this.opacita;
                ctx.fillStyle = this.colore;
                ctx.font = `bold ${this.size}px Arial`;
                
                // Effetto Glow
                ctx.shadowColor = this.colore;
                ctx.shadowBlur = 10;

                ctx.fillText(this.testo, this.x, this.y);
                ctx.restore();
            }
        }

        // Crea le istanze iniziali
        for (let i = 0; i < numeroScritte; i++) {
            scritteArray.push(new ScrittaCadente());
        }

        // Loop di animazione
        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < scritteArray.length; i++) {
                scritteArray[i].aggiorna();
                scritteArray[i].disegna();
            }

            requestAnimationFrame(loop);
        }

        // Avvia l'animazione
        loop();
    </script>
</body>
</html>
