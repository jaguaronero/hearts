<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌹 Pioggia Romantica di Rose</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        height: 100vh;
        background: transparent; /* SFONDO TRASPARENTE */
    }

    .rosa {
        position: fixed;
        top: -60px;
        user-select: none;
        pointer-events: none;
        animation: caduta linear infinite;
        filter: drop-shadow(0 0 8px rgba(255, 0, 150, 0.6));
    }

    @keyframes caduta {
        0% {
            transform: translate(0, 0) rotate(0deg);
            opacity: 1;
        }
        25% {
            transform: translate(30px, 25vh) rotate(90deg);
        }
        50% {
            transform: translate(-30px, 50vh) rotate(180deg);
        }
        75% {
            transform: translate(20px, 75vh) rotate(270deg);
        }
        100% {
            transform: translate(-20px, 110vh) rotate(360deg);
            opacity: 0.8;
        }
    }

    .cuore {
        position: fixed;
        bottom: 20px;
        width: 100%;
        text-align: center;
        font-size: 30px;
        color: pink;
        animation: battito 1.5s infinite;
    }

    @keyframes battito {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.2); }
    }
</style>
</head>

<body>

<div class="cuore">💖 Con Amore 💖</div>

<script>
    const colori = [
        "red", "pink", "deeppink", "hotpink",
        "purple", "violet", "magenta",
        "orange", "yellow", "white"
    ];

    function creaRosa() {
        let rosa = document.createElement("div");
        rosa.classList.add("rosa");
        rosa.innerHTML = "🌹";

        rosa.style.left = Math.random() * 100 + "vw";
        rosa.style.color = colori[Math.floor(Math.random() * colori.length)];
        rosa.style.animationDuration = (6 + Math.random() * 6) + "s";
        rosa.style.animationDelay = Math.random() * 5 + "s";
        rosa.style.fontSize = (20 + Math.random() * 40) + "px";

        rosa.addEventListener("animationiteration", () => {
            rosa.style.left = Math.random() * 100 + "vw";
        });

        document.body.appendChild(rosa);
    }

    for (let i = 0; i < 40; i++) {
        creaRosa();
    }
</script>

</body>
</html>
