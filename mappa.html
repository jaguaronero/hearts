<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mappamondo Box Arcobaleno Rotante 400px</title>
    
    <script src="//unpkg.com/three"></script>
    <script src="//unpkg.com/globe.gl"></script>

    <style>
        body {
            background-color: ;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #fff;
        }

        /* Box contenitore da 400px con Bordo Arcobaleno ad effetto rotazione infinita */
        .rainbow-box-container {
            position: relative;
            width: 400px;
            height: 400px;
            border-radius: 20px;
            overflow: hidden; /* Taglia lo sfondo che ruota fuori dai bordi */
            padding: 5px; /* Questo definisce lo spessore del bordo arcobaleno */
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Lo sfondo arcobaleno che ruota all'infinito DIETRO al box */
        .rainbow-box-container::before {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            background: conic-gradient(#ff0000, #ff7700, #ffdd00, #00ff00, #00ffff, #0000ff, #8b00ff, #ff0000);
            animation: spinRainbow 4s linear infinite;
            z-index: 0;
        }

        /* L'interno del box (copre il centro dello sfondo lasciando visibile solo il bordo) */
        .box-inner {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            z-index: 1;
        }

        /* Animazione CSS che fa ruotare l'arcobaleno a 360 gradi senza mai fermarsi */
        @keyframes spinRainbow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Il Mappamondo dentro il box */
        #globeViz {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Testi fluttuanti sul mappamondo */
        .floating-text-container {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            z-index: 10;
            pointer-events: none; /* Lascia passare i clic sul mappamondo */
        }

        .floating-text-container h2 {
            margin: 0 0 4px 0;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #00ffff;
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
        }

        .stat-text {
            font-size: 13px;
            color: #ccc;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #ff007f;
            text-shadow: 0 0 8px rgba(255, 0, 127, 0.6), 1px 1px 2px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>

    <div class="rainbow-box-container">
        <div class="box-inner">
            
            <div class="floating-text-container">
                <h2>Live Visitor</h2>
                <span class="stat-text">I tuoi accessi totali: </span>
                <span id="total-counter" class="stat-value">0</span>
                <div class="stat-text" style="font-size: 11px; margin-top: 4px; color: #aaa;">
                    Tu sei connesso da: <span id="last-geo" style="color: #00ff00;">Rilevamento in corso...</span>
                </div>
            </div>

            <div id="globeViz"></div>

        </div>
    </div>

    <script>
        // Il punto di arrivo (Salerno)
        const MY_LAT = 40.6783;
        const MY_LNG = 14.7768;

        // Gestione del contatore reale locale
        let localCounter = localStorage.getItem('real_visitor_count');
        if (!localCounter) {
            localCounter = 1;
        } else {
            localCounter = parseInt(localCounter) + 1;
        }
        localStorage.setItem('real_visitor_count', localCounter);
        document.getElementById('total-counter').innerText = localCounter.toLocaleString();

        // Inizializzazione del Mappamondo 3D
        const globe = Globe()
            (document.getElementById('globeViz'))
            .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
            .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png')
            .arcStartLat(d => d.startLat)
            .arcStartLng(d => d.startLng)
            .arcEndLat(d => d.endLat)
            .arcEndLng(d => d.endLng)
            .arcColor(() => ['#00ffff', '#ff007f'])
            .arcDashLength(0.6)
            .arcDashGap(2)
            .arcDashAnimateTime(1500)
            .arcsTransitionDuration(1000)
            .pointsData([])
            .pointColor(() => '#ff007f')
            .pointRadius(0.8);

        // Regolazione perfetta del mappamondo dentro i 400px del box
        globe.width(390);
        globe.height(390);
        globe.controls().autoRotate = true;
        globe.controls().autoRotateSpeed = 0.5;
        globe.controls().enableZoom = false;

        // Tracciamento del visitatore reale via IP Geolocation
        async function trackRealVisitor() {
            try {
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();

                if(data.latitude && data.longitude) {
                    const cityName = data.city || "Sconosciuta";
                    const countryCode = data.country_code || "";
                    
                    document.getElementById('last-geo').innerText = `${cityName} (${countryCode})`;

                    const realArc = [{
                        startLat: data.latitude,
                        startLng: data.longitude,
                        endLat: MY_LAT,
                        endLng: MY_LNG
                    }];

                    globe.arcsData(realArc);
                    
                    // Sposta l'inquadratura verso il visitatore reale
                    globe.pointOfView({ lat: data.latitude, lng: data.longitude, altitude: 2.5 }, 2000);
                } else {
                    document.getElementById('last-geo').innerText = "Posizione non disponibile";
                }
            } catch (error) {
                console.error("Errore nel tracciamento IP:", error);
                document.getElementById('last-geo').innerText = "Tracciamento disattivato/Bloccato";
            }
        }

        trackRealVisitor();
    </script>
</body>
</html>
