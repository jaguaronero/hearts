<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>jaguarluna - Custom Radio Dashboard - Cover Scaled</title>
<style>
body {
  margin: 0;
  background: transparent;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
  font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}

/* ===== CONTENITORE PRINCIPALE DI TUTTO IL LAYOUT ===== */
.container {
  position: relative;
  width: 1308px;
  height: 484px;
  background: transparent;
}

/* ===== CONTENITORI VIDEO LATERALI CON ANIMAZIONE INFINITA ===== */
.video-wrapper {
  position: absolute;
  width: 270px;
  height: 484px;
  overflow: hidden;
  z-index: 1;
  background: transparent;
  border-radius: 20px;
  animation: videoGlow 4s ease-in-out infinite alternate;
}
.left { left: 0; }
.right { right: 0; }

@keyframes videoGlow {
  0% {
    transform: scale(1);
    box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
  }
  100% {
    transform: scale(1.02);
    box-shadow: 0 0 30px rgba(0, 255, 255, 0.8), 0 0 15px rgba(255, 0, 255, 0.5);
  }
}

.video-wrapper::before {
  content: "";
  position: absolute;
  inset: 0;
  padding: 4px;
  border-radius: 20px;
  background: conic-gradient(red, orange, yellow, lime, cyan, blue, violet, red);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
  animation: rotateBorder 4s linear infinite;
}

@keyframes rotateBorder {
  100% {
    filter: drop-shadow(0 0 15px rgba(255, 0, 255, 0.9)) hue-rotate(360deg);
  }
}

.side-video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 16px;
}

.video-text {
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 32px; 
  font-family: 'Trebuchet MS', sans-serif;
  font-weight: bold;
  z-index: 6;
  background: linear-gradient(90deg, red, orange, yellow, lime, cyan, blue, violet, red);
  background-size: 400% 100%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: rainbowText 3s linear infinite;
  cursor: pointer;
}

@keyframes rainbowText {
  0% { background-position: 0%; }
  100% { background-position: 100%; }
}

/* ===== AREA CENTRALE INTEGRATA CON TUTTI I BOX ===== */
.center-area {
  position: absolute;
  left: 280px;
  right: 280px;
  top: 0;
  bottom: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 2;
  background: transparent;
}

/* ===== GRIGLIA CRUSCOTTO RADIO ===== */
.radio-dashboard-grid {
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: auto auto 1fr auto; /* Cambiato il layout delle righe per dare spazio alla cover alla riga 3 */
  gap: 12px;
  padding: 5px 0;
  box-sizing: border-box;
  background: transparent;
}

/* STILE COMUNE PER I BOX SEPARATI DELLA RADIO */
.rainbow-box {
  color: #fff;
  font-weight: bold;
  font-size: 0.85rem;
  text-transform: uppercase;
  padding: 10px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
  border-radius: 12px;
  border: 3px solid transparent;
  background-image: linear-gradient(#1a1a1a, #1a1a1a), 
                    linear-gradient(45deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3, #ff0000);
  background-origin: border-box;
  background-clip: padding-box, border-box;
  background-size: 100% 100%, 300% 300%;
  animation: rainbow-shift 5s linear infinite;
}

@keyframes rainbow-shift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* RIGA 1 */
.go-to-music-box { 
  grid-column: span 3; 
  color: #00ffcc; 
  cursor: pointer; 
  transition: transform 0.2s, filter 0.2s; 
  font-size: 1.6rem;
  padding: 8px 10px;
}
.go-to-music-box:hover { transform: scale(1.04); filter: brightness(1.2); }

.datetime-box { 
  grid-column: span 1; 
  font-size: 0.75rem; 
  color: #fff; 
  letter-spacing: 0.2px;
  padding: 5px;
}

/* RIGA 2 */
.title-box {
  grid-column: span 3; 
  font-size: 1.2rem;
  color: #ffff00;
  overflow: hidden;
  white-space: nowrap;
  display: block;
  padding: 8px 10px;
}
.marquee-text {
  display: inline-block;
  padding-left: 100%;
  animation: marquee 12s linear infinite;
}
@keyframes marquee {
  0% { transform: translate3d(0, 0, 0); }
  100% { transform: translate3d(-100%, 0, 0); }
}

.listeners-box { 
  grid-column: span 1; 
  color: #ff0055; 
  font-size: 0.85rem; 
  letter-spacing: 0.5px; 
  padding: 8px 10px;
}

/* RIGA 3: BOX DELLA COVER SPOSTATO PIÙ SU */
.cover-box {
  grid-column: span 2;
  grid-row: 3;
  height: 95%; 
  margin: auto 30px; 
  padding: 6px;
  overflow: hidden;
  position: relative;
}
.cover-img {
  width: 100%;
  height: 100%;
  object-fit: contain; 
  border-radius: 8px;
  transition: src 0.5s ease-in-out;
}

/* RIGA 4: CONTROLLI, SUBWOOFER, VOLUME, EQUALIZER */
.controls-box {
  grid-column: span 1;
  grid-row: 4;
  flex-direction: row !important;
  justify-content: space-around !important;
  gap: 3px;
  padding: 8px 5px !important;
}
.inner-btn {
  cursor: pointer;
  font-size: 0.9rem;
  transition: transform 0.2s, filter 0.2s;
  font-weight: 900;
  user-select: none;
}
.inner-btn:hover { transform: scale(1.1); filter: brightness(1.3); }
.play-txt { color: #00ff00; }
.stop-txt { color: #ff3333; }
.separator { color: #555; font-size: 0.9rem; user-select: none; }

.subwoofer-box {
  grid-column: span 1;
  grid-row: 4;
  width: 100%;
  padding: 5px;
}
.sub-cone {
  width: 40px;
  height: 40px;
  background: #141414;
  border-radius: 50%;
  border: 2px dashed #666;
  /* Sempre attivo senza .playing */
  animation: sub-thump 0.35s infinite alternate ease-in-out;
}
@keyframes sub-thump {
  0% { transform: scale(0.90); }
  100% { transform: scale(1.08); box-shadow: 0 0 15px rgba(255, 0, 85, 0.6); }
}

.volume-box {
  grid-column: span 1;
  grid-row: 4;
  flex-direction: column !important;
  gap: 4px;
  padding: 5px;
}
.volume-box span { font-size: 0.7rem; letter-spacing: 1px; }
.volume-box input[type="range"] {
  cursor: pointer;
  accent-color: #ff0055;
  width: 85%;
}

.equalizer-box {
  grid-column: span 1;
  grid-row: 4;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  width: 100%;
  gap: 3px;
  padding: 5px 15px;
}
.eq-bar {
  height: 4px;
  width: 15%;
  background: linear-gradient(to right, #00ffcc, #00ff00, #ffff00, #ff0055);
  border-radius: 1px;
  transition: width 0.3s ease;
}
/* Sempre attivi senza .playing */
.eq-bar:nth-child(1) { animation: eq-move-horiz 0.4s infinite alternate ease-in-out; }
.eq-bar:nth-child(2) { animation: eq-move-horiz 0.3s infinite alternate 0.1s ease-in-out; }
.eq-bar:nth-child(3) { animation: eq-move-horiz 0.5s infinite alternate 0.05s ease-in-out; }
.eq-bar:nth-child(4) { animation: eq-move-horiz 0.25s infinite alternate 0.15s ease-in-out; }
.eq-bar:nth-child(5) { animation: eq-move-horiz 0.45s infinite alternate 0.2s ease-in-out; }

@keyframes eq-move-horiz {
  0% { width: 15%; }
  100% { width: 100%; }
}
</style>
</head>
<body>

<div class="container" id="dashboardContainer">

  <div class="video-wrapper left">
    <video class="side-video" autoplay loop muted playsinline>
      <source src="https://jaguaronero.github.io/hearts/jaguarluna.mp4" type="video/mp4">
    </video>
    <div class="video-text" onclick="alert('Azione Go To Music!')">GO_TO_MUSIC</div>
  </div>

  <div class="video-wrapper right">
    <video class="side-video" autoplay loop muted playsinline>
      <source src="https://jaguaronero.github.io/hearts/jaguarluna.mp4" type="video/mp4">
    </video>
    <div class="video-text" onclick="alert('Azione Go To Music!')">GO_TO_MUSIC</div>
  </div>

  <div class="center-area">
    <div class="radio-dashboard-grid">
        
      <div class="rainbow-box go-to-music-box" onclick="alert('Azione Go To Music!')">
          GO TO MUSIC
      </div>
      <div class="rainbow-box datetime-box" id="liveClock">
          Caricamento Data...
      </div>

      <div class="rainbow-box title-box">
          <span class="marquee-text" id="radioTitle">CONNESSIONE IN CORSO AL CANALE STREAM LIVE...</span>
      </div>
      <div class="rainbow-box listeners-box" id="radioListeners">
          🎧 LIVE: --
      </div>

      <div class="rainbow-box cover-box">
          <img src="https://xatimg.com/image/G9mSMzBJMwXk.jpg" alt="Cover" class="cover-img" id="coverImage">
      </div>

      <div class="rainbow-box controls-box">
          <div class="inner-btn play-txt" id="btnPlay">PLAY</div>
          <div class="separator">|</div>
          <div class="inner-btn stop-txt" id="btnStop">STOP</div>
      </div>

      <div class="rainbow-box subwoofer-box">
          <div class="sub-cone"></div>
      </div>

      <div class="rainbow-box volume-box">
          <span>VOLUME</span>
          <input type="range" id="volControl" min="0" max="1" step="0.05" value="0.5">
      </div>

      <div class="rainbow-box equalizer-box">
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
      </div>

    </div>
  </div>

</div>

<audio id="radioStream" preload="none"></audio>

<script>
    const streamUrl = "https://sp4.server89.com:7027/stream";
    const defaultDjCover = "https://xatimg.com/image/G9mSMzBJMwXk.jpg"; 
    
    const radio = document.getElementById('radioStream');
    const btnPlay = document.getElementById('btnPlay');
    const btnStop = document.getElementById('btnStop');
    const volControl = document.getElementById('volControl');
    const liveClock = document.getElementById('liveClock');
    const radioTitle = document.getElementById('radioTitle');
    const radioListeners = document.getElementById('radioListeners');
    const container = document.getElementById('dashboardContainer');
    const coverImage = document.getElementById('coverImage');

    let currentSongTitle = "";
    radio.volume = volControl.value;

    btnPlay.addEventListener('click', () => {
        if (!radio.src) {
            radio.src = streamUrl;
        }
        radio.play()
            .then(() => {
                container.classList.add('playing');
            })
            .catch(err => console.log("Stream bloccato o non supportato: ", err));
    });

    btnStop.addEventListener('click', () => {
        radio.pause();
        radio.src = ''; 
        radio.load();
        container.classList.remove('playing');
    });

    volControl.addEventListener('input', (e) => {
        radio.volume = e.target.value;
    });

    async function updateCoverArtwork(songName) {
        if (!songName || songName.includes("CONNESSIONE IN CORSO") || songName.includes("JAGUAR LUNA LIVE")) {
            coverImage.src = defaultDjCover;
            return;
        }

        try {
            const query = encodeURIComponent(songName.trim());
            const response = await fetch(`https://itunes.apple.com/search?term=${query}&media=music&limit=1`);
            if (!response.ok) throw new Error();
            
            const data = await response.json();
            if (data.results && data.results.length > 0) {
                let artworkUrl = data.results[0].artworkUrl100.replace("100x100bb.jpg", "600x600bb.jpg");
                coverImage.src = artworkUrl;
            } else {
                coverImage.src = defaultDjCover;
            }
        } catch (err) {
            coverImage.src = defaultDjCover;
        }
    }

    async function fetchRadioStats() {
        try {
            const response = await fetch('https://sp4.server89.com:7027/stats?json=1');
            if (!response.ok) throw new Error('Errore server');
            
            const data = await response.json();
            const canzone = data.songtitle || data.currentsong || "RADIO JAGUAR LUNA LIVE";
            const utenti = data.uniquestreamers || data.currentlisteners || data.listeners || "0";
            
            radioTitle.innerText = `IN ONDA ORA: ${canzone.toUpperCase()} ***`;
            radioListeners.innerText = `🎧 LIVE: ${utenti}`;

            if (canzone !== currentSongTitle) {
                currentSongTitle = canzone;
                updateCoverArtwork(currentSongTitle);
            }
        } catch (error) {
            console.error("Errore recupero statistiche:", error);
            radioTitle.innerText = "ON AIR: JAGUAR LUNA LIVE MUSIC ***";
            radioListeners.innerText = "LIVE OK";
            coverImage.src = defaultDjCover;
        }
    }

    setInterval(fetchRadioStats, 7000);
    fetchRadioStats();

    function startItalianClock() {
        const adesso = new Date();
        const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
        let dataIta = adesso.toLocaleDateString('it-IT', options);
        dataIta = dataIta.charAt(0).toUpperCase() + dataIta.slice(1);
        const oraIta = adesso.toLocaleTimeString('it-IT');
        liveClock.innerHTML = `${dataIta}<br>${oraIta}`;
    }

    setInterval(startItalianClock, 1000);
    startItalianClock();
</script>

</body>
</html>
