<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equalizzatori Go To Music & Mille Ricordi - Sfondo Trasparente</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: transparent !important;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            box-sizing: border-box;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Container principale per gestire gli elementi verticali */
        .eq-container {
            width: 420px;
            height: 480px;
            background: transparent;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Contenitore pulsanti superiori (Lato Sinistro) */
        .top-buttons-container {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
            z-index: 20;
        }

        /* Stile pulsanti con scritte #8F0808 */
        .stream-btn {
            padding: 10px 16px;
            border-radius: 30px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: #8F0808;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            outline: none;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            user-select: none;
        }

        .btn-goto {
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.5), rgba(79, 172, 254, 0.7));
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.5);
        }
        .btn-goto:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.8);
            border-color: rgba(0, 242, 254, 0.9);
        }

        .btn-ricordi {
            background: linear-gradient(135deg, rgba(255, 0, 128, 0.5), rgba(255, 117, 140, 0.7));
            box-shadow: 0 0 15px rgba(255, 0, 128, 0.5);
        }
        .btn-ricordi:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 0, 128, 0.8);
            border-color: rgba(255, 0, 128, 0.9);
        }

        /* Stato in riproduzione per i pulsanti */
        .stream-btn.playing {
            border-color: #00ff80 !important;
            box-shadow: 0 0 30px rgba(0, 255, 128, 0.8) !important;
            animation: pulsePlayingBtn 1s ease-in-out infinite alternate;
        }

        @keyframes pulsePlayingBtn {
            0% { transform: scale(0.96); }
            100% { transform: scale(1.06); }
        }

        /* Contenitore orologio/data superiore con Arcobaleno Animato Infinito e sfumature */
        .top-clock-container {
            text-align: center;
            margin-bottom: 15px;
            z-index: 20;
            user-select: none;
        }

        .gradient-clock {
            font-size: 14px;
            font-weight: bold;
            background: linear-gradient(270deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff, #ff0000);
            background-size: 600% 600%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbowGradient 8s linear infinite;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }

        @keyframes rainbowGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Wrapper centrale dell'equalizzatore */
        .scifi-eq-wrapper {
            position: relative;
            width: 360px;
            height: 360px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Anello esterno con arcobaleno animato e rotazione oraria */
        .tech-ring-outer {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2.5px dashed;
            border-radius: 50%;
            animation: spinClockwise 25s linear infinite, rainbowColor 8s linear infinite;
        }

        /* Anello medio con arcobaleno animato e rotazione antioraria */
        .tech-ring-inner {
            position: absolute;
            width: 280px;
            height: 280px;
            border: 2.5px dotted;
            border-radius: 50%;
            animation: spinCounter 18s linear infinite, rainbowColor 8s linear infinite reverse;
        }

        /* Nucleo olografico centrale */
        .holo-core {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.35) 0%, rgba(255, 0, 128, 0.25) 70%, transparent 100%);
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.5), inset 0 0 20px rgba(255, 0, 128, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(0, 242, 254, 0.8);
            animation: pulseCore 2.5s ease-in-out infinite alternate;
            z-index: 10;
            user-select: none;
        }

        .core-title {
            font-size: 11px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            text-align: center;
        }

        .core-icon {
            font-size: 18px;
            margin-top: 2px;
        }

        /* Singolo nodo/barra dello spettro circolare */
        .spectrum-node {
            position: absolute;
            bottom: 50%;
            left: 50%;
            width: 4px;
            height: 110px;
            transform-origin: bottom center;
            border-radius: 4px;
            animation: scifiWave 1.6s ease-in-out infinite alternate;
            box-shadow: 0 0 10px currentColor;
        }

        /* Animazioni */
        @keyframes spinClockwise {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes spinCounter {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-360deg); }
        }

        @keyframes rainbowColor {
            0% { border-color: hsl(0, 100%, 55%); box-shadow: 0 0 20px hsl(0, 100%, 55%), inset 0 0 15px hsl(0, 100%, 55%); }
            16% { border-color: hsl(60, 100%, 55%); box-shadow: 0 0 20px hsl(60, 100%, 55%), inset 0 0 15px hsl(60, 100%, 55%); }
            33% { border-color: hsl(120, 100%, 55%); box-shadow: 0 0 20px hsl(120, 100%, 55%), inset 0 0 15px hsl(120, 100%, 55%); }
            50% { border-color: hsl(180, 100%, 55%); box-shadow: 0 0 20px hsl(180, 100%, 55%), inset 0 0 15px hsl(180, 100%, 55%); }
            66% { border-color: hsl(240, 100%, 55%); box-shadow: 0 0 20px hsl(240, 100%, 55%), inset 0 0 15px hsl(240, 100%, 55%); }
            83% { border-color: hsl(300, 100%, 55%); box-shadow: 0 0 20px hsl(300, 100%, 55%), inset 0 0 15px hsl(300, 100%, 55%); }
            100% { border-color: hsl(360, 100%, 55%); box-shadow: 0 0 20px hsl(360, 100%, 55%), inset 0 0 15px hsl(360, 100%, 55%); }
        }

        @keyframes pulseCore {
            0% { transform: scale(0.9); opacity: 0.7; }
            100% { transform: scale(1.05); opacity: 1; }
        }

        @keyframes scifiWave {
            0% { transform: translate(-50%, 0) rotate(var(--angle)) scaleY(0.25); filter: brightness(0.5); }
            50% { transform: translate(-50%, 0) rotate(var(--angle)) scaleY(1.4); filter: brightness(1.5); }
            100% { transform: translate(-50%, 0) rotate(var(--angle)) scaleY(0.6); filter: brightness(0.9); }
        }
    </style>
</head>
<body>

    <!-- Container Sinistro con i due pulsanti stream -->
    <div class="eq-container">
        <div class="top-buttons-container">
            <button class="stream-btn btn-goto" id="btnGoToMusic">
                <span>Go To Music</span>
                <span class="btn-icon">▶</span>
            </button>
            <button class="stream-btn btn-ricordi" id="btnMilleRicordi">
                <span>Mille Ricordi</span>
                <span class="btn-icon">▶</span>
            </button>
        </div>
        <div id="eq-left"></div>
    </div>

    <!-- Container Destro con Orologio Arcobaleno e Data in italiano -->
    <div class="eq-container">
        <div class="top-clock-container">
            <div class="gradient-clock" id="liveClock">Caricamento data...</div>
        </div>
        <div id="eq-right"></div>
    </div>

    <!-- Elementi Audio -->
    <audio id="streamGoToMusic" preload="none">
        <source src="https://sp4.server89.com:7027/stream" type="audio/mpeg">
    </audio>
    <audio id="streamMilleRicordi" preload="none">
        <source src="https://node-14.zeno.fm/xh0txuqr0v8uv?zs=KULRBS6sQcGK70KY33r7IQ&rj-tok=AAABgDktPVMA09m2cc37_h6yBA&rj-ttl=5" type="audio/mpeg">
    </audio>

    <script>
        // Funzione per generare l'equalizzatore circolare sci-fi
        function createRainbowSciFiEqualizer(containerId, centerText) {
            const container = document.getElementById(containerId);
            const wrapper = document.createElement('div');
            wrapper.className = 'scifi-eq-wrapper';

            const outerRing = document.createElement('div');
            outerRing.className = 'tech-ring-outer';
            const innerRing = document.createElement('div');
            innerRing.className = 'tech-ring-inner';
            
            const core = document.createElement('div');
            core.className = 'holo-core';
            core.innerHTML = `
                <span class="core-title">${centerText}</span>
                <span class="core-icon">♫</span>
            `;

            wrapper.appendChild(outerRing);
            wrapper.appendChild(innerRing);
            wrapper.appendChild(core);

            const nodeCount = 36;
            for (let i = 0; i < nodeCount; i++) {
                const node = document.createElement('div');
                node.className = 'spectrum-node';

                const angle = (i * 360) / nodeCount;
                const hue = (i * (360 / nodeCount)) % 360;

                node.style.setProperty('--angle', `${angle}deg`);
                node.style.background = `linear-gradient(to top, hsl(${hue}, 100%, 50%), hsl(${(hue + 90) % 360}, 100%, 70%))`;
                node.style.color = `hsl(${hue}, 100%, 60%)`;
                node.style.animationDelay = `${(i * 0.05) % 1.6}s`;

                wrapper.appendChild(node);
            }

            container.appendChild(wrapper);
        }

        // Creazione degli equalizzatori nei rispettivi container
        createRainbowSciFiEqualizer('eq-left', 'Stream Audio');
        createRainbowSciFiEqualizer('eq-right', 'Live Clock');

        // Gestione dei flussi audio e dei pulsanti
        const audioGoTo = document.getElementById('streamGoToMusic');
        const audioRicordi = document.getElementById('streamMilleRicordi');
        
        const btnGoTo = document.getElementById('btnGoToMusic');
        const btnRicordi = document.getElementById('btnMilleRicordi');

        function updateButtonState(btn, isPlaying) {
            const icon = btn.querySelector('.btn-icon');
            if (isPlaying) {
                btn.classList.add('playing');
                icon.textContent = '⏸';
            } else {
                btn.classList.remove('playing');
                icon.textContent = '▶';
            }
        }

        // Evento click Go To Music
        btnGoTo.addEventListener('click', () => {
            if (audioGoTo.paused) {
                audioRicordi.pause();
                updateButtonState(btnRicordi, false);
                
                audioGoTo.play().then(() => {
                    updateButtonState(btnGoTo, true);
                }).catch(err => console.error("Errore stream GoToMusic:", err));
            } else {
                audioGoTo.pause();
                updateButtonState(btnGoTo, false);
            }
        });

        // Evento click Mille Ricordi
        btnRicordi.addEventListener('click', () => {
            if (audioRicordi.paused) {
                audioGoTo.pause();
                updateButtonState(btnGoTo, false);
                
                audioRicordi.play().then(() => {
                    updateButtonState(btnRicordi, true);
                }).catch(err => console.error("Errore stream MilleRicordi:", err));
            } else {
                audioRicordi.pause();
                updateButtonState(btnRicordi, false);
            }
        });

        // Sincronizzazione stati audio nativi
        audioGoTo.addEventListener('play', () => updateButtonState(btnGoTo, true));
        audioGoTo.addEventListener('pause', () => updateButtonState(btnGoTo, false));
        
        audioRicordi.addEventListener('play', () => updateButtonState(btnRicordi, true));
        audioRicordi.addEventListener('pause', () => updateButtonState(btnRicordi, false));

        // Aggiornamento Orologio e Data in formato italiano in tempo reale
        function updateClock() {
            const now = new Date();
            const options = { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            };
            let dateStr = now.toLocaleDateString('it-IT', options);
            dateStr = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);
            
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            const timeStr = `${hours}:${minutes}:${seconds}`;
            
            document.getElementById('liveClock').textContent = `${dateStr} - ${timeStr}`;
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
