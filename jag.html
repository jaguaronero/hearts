<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dj Jaguaro Badge</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: transparent; /* Sfondo trasparente */
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Montserrat', 'Segoe UI', Roboto, sans-serif;
    }

    /* Container circolare con immagine di sfondo e effetto battito del cuore */
    .circle-card {
      position: relative;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      /* Immagine di sfondo */
      background-image: url('circle.png');
      background-size: 116%;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.8);
      padding: 7px;
      overflow: hidden;
      /* Animazione battito del cuore sull'immagine di sfondo */
      animation: heartbeat-bg 1.3s infinite ease-in-out;
    }

    /* Keyframes per il classico ritmo del battito cardiaco (doppio impulso) */
    @keyframes heartbeat-bg {
      0% {
        background-size: 116%;
      }
      14% {
        background-size: 126%; /* Primo battito (forte) */
      }
      28% {
        background-size: 116%;
      }
      42% {
        background-size: 121%; /* Secondo battito (più lieve) */
      }
      70% {
        background-size: 116%;
      }
      100% {
        background-size: 116%;
      }
    }

    /* Bordo arcobaleno animato all'infinito (spessore 2px) */
    .circle-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      padding: 2px;
      background: conic-gradient(
        #ff0000, 
        #ff7f00, 
        #ffff00, 
        #00ff00, 
        #00ffff, 
        #0000ff, 
        #8b00ff, 
        #ff0000
      );
      -webkit-mask: 
         linear-gradient(#fff 0 0) content-box, 
         linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
              mask-composite: exclude;
      animation: spin-rainbow 2.5s linear infinite;
      z-index: 2;
      pointer-events: none;
    }

    @keyframes spin-rainbow {
      to {
        transform: rotate(360deg);
      }
    }

    /* Contenitore per testo ed equalizzatore */
    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      transform: translateY(35px); 
    }

    /* Scritta Dj Jaguaro con sfumature Neon */
    .dj-text {
      font-size: 1.8rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #ff007f, #00f3ff, #ffe600, #ff007f);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: neon-gradient 4s ease infinite;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.95)) 
              drop-shadow(0 0 10px rgba(0, 243, 255, 1)) 
              drop-shadow(0 0 18px rgba(255, 0, 127, 0.9));
      margin-bottom: 10px;
      text-align: center;
    }

    @keyframes neon-gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Equalizzatore animato sotto la scritta */
    .equalizer {
      display: flex;
      align-items: flex-end;
      gap: 5px;
      height: 30px;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.9));
    }

    .equalizer .bar {
      width: 5px;
      background: linear-gradient(180deg, #00f3ff, #ff007f);
      border-radius: 3px;
      animation: equalize 1.2s ease-in-out infinite alternate;
      box-shadow: 0 0 10px rgba(0, 243, 255, 1);
    }

    /* Tempi di animazione differenziati per le barre */
    .equalizer .bar:nth-child(1) { animation-duration: 0.8s; animation-delay: 0.1s; }
    .equalizer .bar:nth-child(2) { animation-duration: 1.1s; animation-delay: 0.3s; }
    .equalizer .bar:nth-child(3) { animation-duration: 0.7s; animation-delay: 0.0s; }
    .equalizer .bar:nth-child(4) { animation-duration: 1.3s; animation-delay: 0.4s; }
    .equalizer .bar:nth-child(5) { animation-duration: 0.9s; animation-delay: 0.2s; }
    .equalizer .bar:nth-child(6) { animation-duration: 1.0s; animation-delay: 0.5s; }
    .equalizer .bar:nth-child(7) { animation-duration: 0.8s; animation-delay: 0.3s; }

    @keyframes equalize {
      0% {
        height: 15%;
      }
      100% {
        height: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="circle-card">
    <div class="content">
      <h1 class="dj-text">Dj Jaguaro</h1>
      <div class="equalizer">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
    </div>
  </div>

</body>
</html>
